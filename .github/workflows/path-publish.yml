name: Publish Path

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract and publish source
        unzip -q PATH_SOURCE_3d0c6b7.zip
          set -e
          if [ ! -f public/index.html ]; then
            unzip -q PATH_SOURCE_3d0
            rm -f Path_V78_READY_FOR_DEPLOY.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Publish Path source code"
            git push origin HEAD:main
          fi
          test -s public/index.html
          node tests/test_inline_scripts.mjs
          node tests/test_removed_features.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
