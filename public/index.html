      projects:{zh:['清洗一份有缺失值的数据，并记录处理选择','制作仪表盘或数据故事，回答一个具体问题','比较两个模型，解释结果偏差和适用范围'],en:['Clean a dataset with missing values and document decisions','Build a dashboard or data story for a concrete question','Compare two models and explain bias and limits']},
      careers:{zh:['数据分析师、商业/产品分析师','数据科学家（通常需更强建模与编程能力）','运营、市场、风险或政策数据分析','数据工程或研究助理等相邻方向'],en:['Data analyst, business analyst or product analyst','Data scientist, often requiring stronger modelling and coding','Operations, marketing, risk or policy analytics','Adjacent roles such as data engineering or research assistance']},
      fit:PAIRS('适合喜欢发现规律、核对证据、用图表表达结论并追问“这个结论可靠吗”的人。','A good fit for students who enjoy finding patterns, checking evidence, communicating with charts and asking whether a conclusion is reliable.'),
      challenge:PAIRS('工作常常先花很多时间清理数据；相关性不等于因果关系。','Much of the work is data cleaning, and correlation does not automatically mean causation.'),
      compare:PAIRS('比纯数学更强调真实数据和应用；与 AI 重合，但通常更完整覆盖从数据获取到解释的流程。','More applied to real datasets than pure mathematics. It overlaps with AI but often covers the full workflow from data acquisition to interpretation.')},
    {id:'econ',match:/economics|political economy|economic/i,
      intro:PAIRS('研究个人、企业和政府如何在资源有限的情况下作选择，以及这些选择如何影响价格、就业、增长和公共政策。','Studies how people, firms and governments make choices under scarcity and how those choices affect prices, employment, growth and policy.'),
      courses:{zh:['微观经济学：个人、企业、竞争与市场','宏观经济学：通胀、失业、增长和货币政策','数学与统计：用模型描述关系、分析数据','应用方向：国际贸易、发展经济、公共政策或金融经济等'],en:['Microeconomics: individuals, firms, competition and markets','Macroeconomics: inflation, unemployment, growth and monetary policy','Mathematics and statistics for modelling and evidence','Applications such as trade, development, public policy or financial economics']},
      projects:{zh:['用公开数据分析通胀、住房或就业趋势','比较一种政策的可能收益、成本和受影响群体','读一篇研究报告并区分证据、假设与观点'],en:['Analyse public data on inflation, housing or employment','Compare the possible benefits, costs and affected groups of a policy','Read a research report and distinguish evidence, assumptions and opinions']},
      careers:{zh:['经济/政策研究助理','商业、市场或行业分析','银行、金融机构的分析类岗位（依技能和岗位要求）','咨询、公共部门或继续读经济/统计/公共政策等'],en:['Economic or policy research assistant','Business, market or industry analysis','Analytical roles in banks or financial institutions, depending on skills','Consulting, public sector or further study in economics, statistics or policy']},
      fit:PAIRS('适合对社会运行、市场变化、政策后果有好奇心，并愿意用图表、数据和模型解释问题的人。','A good fit for students curious about markets, society and policy, and willing to use graphs, data and models to explain them.'),
      challenge:PAIRS('高年级课程可能有不少数学、统计和抽象模型；经济学并不只是商业新闻或理财。','Advanced study can involve substantial mathematics, statistics and abstract models; economics is not just business news or personal finance.'),
      compare:PAIRS('比商科管理更强调机制与模型；比数据科学更强调经济理论、市场激励和政策含义。','More focused on mechanisms and models than business management, and on economic theory and policy meaning than data science.')},
    {id:'finance',match:/finance|financial|accounting and finance|fintech|quantitative finance|applied computing in finance/i,
      intro:PAIRS('研究资金如何定价、配置与管理。不同课程可能偏企业金融、投资、风险、金融市场，或结合数学和编程的量化方向。','Studies how money is priced, allocated and managed, with possible emphasis on corporate finance, investment, risk, markets or quantitative methods.'),
      courses:{zh:['金融基础：货币、利率、资产与金融市场','企业金融：融资、投资决策、估值与资本成本','投资与风险：组合、风险收益、衍生品等（依方向而异）','定量工具：统计、建模、数据分析；量化方向会更强调数学与代码'],en:['Finance foundations: money, interest rates, assets and markets','Corporate finance: funding, investment decisions, valuation and cost of capital','Investments and risk: portfolios, risk-return and derivatives, depending on focus','Quantitative tools: statistics, modelling and data analysis; quantitative tracks use more mathematics and code']},
      projects:{zh:['搭建简单的公司估值模型，并说明假设','用历史数据比较风险与回报，但不把过去表现当成未来保证','分析一个金融科技场景中的用户需求、风险与规则'],en:['Build a simple company valuation model and explain assumptions','Compare historical risk and return without treating past results as guarantees','Analyse user needs, risks and rules in a fintech case']},
      careers:{zh:['金融分析、企业财务或风险分析','银行、保险、投资相关的分析岗位（岗位要求不同）','金融科技产品、数据或运营分析','特定投资/专业资格岗位可能需要进一步训练、证照或研究生学习'],en:['Financial analysis, corporate finance or risk analysis','Analytical roles in banking, insurance or investments, with varying requirements','Fintech product, data or operations analysis','Specialised investment or credentialed roles may need further training, licences or graduate study']},
      fit:PAIRS('适合对公司如何融资、市场如何运作、风险如何衡量感兴趣的人；定量方向尤其需要数学耐心。','A good fit for students interested in company funding, market mechanisms and measuring risk; quantitative tracks require comfort with mathematics.'),
      challenge:PAIRS('金融课程常结合数量分析、制度和伦理；市场岗位竞争与周期变化也较明显，学位不保证进入某类岗位。','Finance blends quantitative work with institutions and ethics. Market cycles and hiring competition also mean a degree does not guarantee a specific role.'),
      compare:PAIRS('比经济学更聚焦资金、资产和公司决策；和金融科技相比，普通金融未必要求同等深度的软件开发。','More focused on money, assets and corporate decisions than economics; general finance may require less software development than fintech.')},
    {id:'business',match:/business administration|business management|commerce|management|marketing|business(?!.*analytics)|integrative studies/i,
      intro:PAIRS('研究组织如何创造价值、协调团队、理解客户并作出经营决策。不同课程会在市场、管理、运营和战略之间有不同侧重。','Studies how organisations create value, coordinate teams, understand customers and make operating decisions.'),
      courses:{zh:['会计与财务基础：读懂组织的经营结果','市场与消费者：需求、品牌、研究和营销策略','组织与运营：团队、流程、供应链和管理决策','战略与创业：商业模式、竞争、创新及案例分析'],en:['Accounting and finance foundations to understand organisational performance','Markets and consumers: demand, branding, research and marketing','Organisation and operations: teams, processes, supply chains and decisions','Strategy and entrepreneurship: business models, competition, innovation and cases']},
      projects:{zh:['为某个产品进行用户访谈并提出市场方案','用成本、收入和需求假设评估商业模式','分析团队协作、运营流程或企业案例'],en:['Interview users and propose a market approach for a product','Evaluate a business model using cost, revenue and demand assumptions','Analyse teamwork, operating processes or a company case']},
      careers:{zh:['运营、市场、销售或客户洞察','商业分析、项目协调或管理培训方向','创业团队、产品运营或咨询支持','实际岗位通常还看实习经验、沟通能力和领域技能'],en:['Operations, marketing, sales or customer insights','Business analysis, project coordination or management development','Start-ups, product operations or consulting support','Employers also look at experience, communication and domain skills']},
      fit:PAIRS('适合喜欢理解人和组织、沟通协作、观察市场并将点子转化为计划的人。','A good fit for students who enjoy understanding people and organisations, collaborating, observing markets and turning ideas into plans.'),
      challenge:PAIRS('专业名称广，选课和实习方向会显著影响技能组合；只靠“学商科”标签通常不够。','The field is broad, so electives and experience strongly shape your skill set. The business label alone is rarely enough.'),
      compare:PAIRS('比经济学更重组织实践和管理；比商业分析更少强制聚焦统计、数据建模与代码。','More focused on organisational practice than economics and usually less data-modelling-heavy than business analytics.')},
    {id:'analytics',match:/business analytics|business intelligence|operations research|management science|information management/i,
      intro:PAIRS('把商业问题变成可分析的问题，用统计、数据、优化和可视化帮助团队作决策。','Turns business questions into analytical problems using statistics, data, optimisation and visualisation to support decisions.'),
      courses:{zh:['统计与实验：描述数据、抽样、检验与测量','编程和数据管理：表格、数据库、清理与查询','预测和优化：回归、需求预测、流程优化或模拟','商业沟通：指标设计、仪表盘、决策建议和案例'],en:['Statistics and experimentation: description, sampling, testing and measurement','Programming and data management: spreadsheets, databases, cleaning and queries','Prediction and optimisation: regression, forecasting, process optimisation or simulation','Business communication: metrics, dashboards and recommendations']},
      projects:{zh:['用数据找出流程中的瓶颈或客户流失线索','搭建仪表盘并给出有证据的行动建议','比较不同方案的成本、收益和不确定性'],en:['Use data to identify process bottlenecks or customer churn signals','Build a dashboard and evidence-based recommendations','Compare costs, benefits and uncertainty across alternatives']},
      careers:{zh:['商业/产品/运营分析师','供应链、定价或客户洞察分析','咨询或数据驱动的项目支持','继续深造分析学、信息系统、统计或管理科学'],en:['Business, product or operations analyst','Supply chain, pricing or customer-insights analysis','Consulting or data-driven project support','Further study in analytics, information systems, statistics or management science']},
      fit:PAIRS('适合既关心现实商业问题，又愿意使用数据和数学来验证直觉的人。','A good fit for students interested in business problems who are also willing to use data and mathematics to test intuition.'),
      challenge:PAIRS('需要准确理解业务定义和数据限制；图表漂亮并不代表结论正确。','You must understand business definitions and data limits. A polished dashboard does not guarantee a correct conclusion.'),
      compare:PAIRS('比一般管理更强调量化决策；比纯数据科学更常把分析直接放在商业场景里。','More quantitative than general management and more directly tied to business contexts than pure data science.')},
    {id:'accounting',match:/accountancy|accounting|accounting and finance/i,
      intro:PAIRS('学习如何记录、解释和审视组织的财务活动，并用一致规则帮助管理者、投资者和监管者理解经营状况。','Studies how to record, interpret and examine financial activity so stakeholders can understand organisational performance.'),
      courses:{zh:['财务会计：记录交易、编制与理解财务报表','管理会计：成本、预算、绩效和内部决策','审计与控制：证据、风险、内部控制和合规','税务、商业法与数据工具：内容因国家和课程而异'],en:['Financial accounting: transactions and financial statements','Management accounting: cost, budgets, performance and internal decisions','Audit and controls: evidence, risk, internal control and compliance','Tax, business law and data tools, varying by jurisdiction']},
      projects:{zh:['阅读公司财务报表并解释关键指标','分析预算偏差和成本结构','用案例识别内部控制风险并提出改进'],en:['Interpret a company’s financial statements and key indicators','Analyse budget variances and cost structures','Identify internal-control risks in a case and suggest improvements']},
      careers:{zh:['会计、审计或财务报告相关岗位','预算、内部控制、税务或合规支持','企业财务分析或运营财务','注册会计师等资格需按当地规定满足额外考试与实践要求'],en:['Accounting, audit or financial reporting roles','Budgeting, internal controls, tax or compliance support','Corporate or operational finance analysis','Professional credentials require additional exams and experience under local rules']},
      fit:PAIRS('适合重视细节、规则、证据链和数字一致性的人。','A good fit for students who value detail, rules, evidence trails and numerical consistency.'),
      challenge:PAIRS('既有原则理解，也有规范和时限；不同地区的会计与税务规则不能随意通用。','It combines principles with detailed standards and deadlines. Accounting and tax rules differ across jurisdictions.'),
      compare:PAIRS('比金融更重报告、审计和控制；比经济学更重组织财务记录与规则。','More focused on reporting, audit and controls than finance, and on records and standards than economics.')},
    {id:'infosys',match:/information systems|information technology|cyber|security|computing & law|digital media technology/i,
      intro:PAIRS('关注组织如何使用技术、数据和流程解决问题。信息系统通常连接商业与 IT；网络安全则更聚焦保护系统、身份和信息。','Focuses on how organisations use technology, data and processes. Information systems connects business and IT; cybersecurity focuses more on protecting systems and information.'),
      courses:{zh:['系统与数据库：信息如何存储、流动和被使用','编程与分析：自动化、数据处理和需求分析','组织与项目：业务流程、系统设计和技术项目管理','安全方向（若课程提供）：威胁建模、权限、隐私和防护基础'],en:['Systems and databases: how information is stored, moved and used','Programming and analysis: automation, data processing and requirements','Organisation and projects: business processes, system design and project management','Security tracks may cover threat modelling, access, privacy and protection']},
      projects:{zh:['绘制一个组织的业务流程并设计系统改进方案','建立数据库或简易内部工具','做隐私风险检查或基础安全威胁模型'],en:['Map an organisation’s process and design a system improvement','Build a database or simple internal tool','Conduct a privacy review or basic security threat model']},
      careers:{zh:['业务/系统分析师、IT 咨询','信息系统实施、项目协调或产品支持','数据库、IT 运营或治理与合规支持','网络安全岗位需要针对岗位的实践能力和持续学习'],en:['Business or systems analyst, IT consulting','Information-system implementation, project coordination or product support','Database, IT operations, governance or compliance support','Cybersecurity roles require job-specific practical skills and ongoing learning']},
      fit:PAIRS('适合喜欢技术又愿意了解用户、团队和组织流程的人。','A good fit for students who like technology and also want to understand users, teams and organisational processes.'),
      challenge:PAIRS('要同时考虑技术限制和人的使用情境；不同学校的课程可能偏技术、商业或安全。','You must consider both technical limits and human use. Programmes can lean toward technology, business or security.'),
      compare:PAIRS('比计算机科学通常更关注技术如何落地于组织；网络安全方向会进一步聚焦风险和防护。','Often more focused on technology in organisations than computer science; cybersecurity tracks focus further on risk and protection.')},
    {id:'math',match:/mathematics|mathematical sciences|pure mathematics|applied mathematics/i,
      intro:PAIRS('研究数量、结构、变化和逻辑关系。学习重点不只是计算答案，而是建立模型、理解证明并判断方法何时适用。','Studies quantity, structure, change and logical relationships. The goal is not just calculation, but modelling, proof and knowing when methods apply.'),
      courses:{zh:['微积分与线性代数：变化、空间与多维关系','证明与离散数学：逻辑、集合、结构和算法基础','概率、统计与优化：不确定性和最佳方案','高阶方向：纯数学、应用数学、数值计算或数学建模'],en:['Calculus and linear algebra: change, space and multivariable relationships','Proof and discrete mathematics: logic, sets, structures and algorithmic foundations','Probability, statistics and optimisation: uncertainty and best solutions','Advanced options: pure/applied mathematics, numerical computation or modelling']},
      projects:{zh:['把现实现象转化为数学模型，写明假设','用计算工具模拟或近似求解问题','阅读证明并解释每一步为何成立'],en:['Translate a real phenomenon into a model and state assumptions','Use computational tools to simulate or approximate a solution','Explain why each step in a proof is valid']},
      careers:{zh:['数据/定量分析、建模或优化相关岗位','技术行业中的算法、研究或分析工作（通常还需相应技能）','教育、研究或应用数学方向','继续深造数学、统计、计算、金融工程等'],en:['Data or quantitative analysis, modelling or optimisation','Algorithmic, research or analytical roles in technology with additional skills','Education, research or applied mathematics','Further study in mathematics, statistics, computing or financial engineering']},
      fit:PAIRS('适合享受抽象问题、逻辑推演、推导和持续试错的人。','A good fit for students who enjoy abstract questions, logical reasoning, derivation and sustained problem solving.'),
      challenge:PAIRS('抽象程度会逐渐提高；会做题不总等于能写严谨证明或独立建模。','Abstraction increases over time; solving exercises is not always the same as proving or modelling independently.'),
      compare:PAIRS('比数据科学更可能深入理论与证明；应用数学会更强调把数学方法用于具体系统。','Often more theoretical and proof-oriented than data science; applied mathematics emphasises using mathematical methods on concrete systems.')},
    {id:'physics',match:/physics|astrophysics|natural sciences/i,
      intro:PAIRS('用数学和实验解释自然界的规律，从力、能量和波动延伸到材料、量子或宇宙等主题。','Uses mathematics and experiments to explain nature, from forces and energy to waves, materials, quantum phenomena or the universe.'),
      courses:{zh:['经典物理：力学、能量、振动和波','数学方法：微积分、微分方程、线性代数','实验与测量：仪器、误差、数据分析和报告','进阶主题：电磁学、热学、量子、光学或天体物理等'],en:['Classical physics: mechanics, energy, oscillations and waves','Mathematical methods: calculus, differential equations and linear algebra','Laboratory work: instruments, uncertainty, analysis and reporting','Advanced topics may include electromagnetism, thermodynamics, quantum, optics or astrophysics']},
      projects:{zh:['设计实验并评估测量误差','用代码模拟运动、波或物理系统','将观测数据与理论预测对比'],en:['Design an experiment and assess measurement uncertainty','Simulate motion, waves or a physical system with code','Compare observations with theoretical predictions']},
      careers:{zh:['研究、实验室或技术研发（不少研究岗位需研究生训练）','仪器、工程、建模或技术分析','数据分析、软件或定量行业的跨领域岗位','继续读物理、工程、材料、天体物理等'],en:['Research, laboratory or technical R&D, often with postgraduate training for research roles','Instrumentation, engineering, modelling or technical analysis','Cross-disciplinary data, software or quantitative roles','Further study in physics, engineering, materials or astrophysics']},
      fit:PAIRS('适合喜欢数学、追问事物为什么如此、并愿意用实验检验想法的人。','A good fit for students who enjoy mathematics, asking why things behave as they do and testing ideas experimentally.'),
      challenge:PAIRS('数学和实验报告要求高；有些问题答案不会一眼可见，需要反复修正模型。','Mathematics and laboratory reporting can be demanding; many answers require iterative model refinement.'),
      compare:PAIRS('比工程更强调解释自然规律；工程通常更聚焦用知识设计和优化可用系统。','More focused on explaining natural laws than engineering, which usually emphasises designing and improving usable systems.')},
    {id:'chem',match:/chemistry|chemical science|chemical engineering/i,
      intro:PAIRS('研究物质由什么组成、如何反应、怎样被测量或制造。化学偏分子与反应；化学工程更关注规模化工艺与系统。','Studies what matter is made of, how it reacts and how it can be measured or produced. Chemistry centres on substances and reactions; chemical engineering on scalable processes.'),
      courses:{zh:['化学基础：原子结构、键、反应与平衡','有机、无机、物理或分析化学等分支','实验技能：合成、测量、仪器、数据和安全规范','应用主题：材料、药物、能源、环境或过程设计'],en:['Foundations: atomic structure, bonding, reactions and equilibrium','Branches such as organic, inorganic, physical or analytical chemistry','Laboratory skills: synthesis, measurement, instruments, data and safety','Applications in materials, medicines, energy, environment or process design']},
      projects:{zh:['按规范设计实验、记录数据并讨论误差','用光谱或其他测量结果判断样品特征','比较反应条件对产率、成本或环境影响的作用'],en:['Design an experiment, record data and discuss uncertainty','Interpret spectra or measurements to identify sample properties','Compare how reaction conditions affect yield, cost or environmental impact']},
      careers:{zh:['实验室分析、质量控制或技术支持','材料、制药、食品、能源或环境相关行业','化工工艺或研发岗位（工程路线需相应训练）','研究与部分研发工作通常更偏好研究生学历'],en:['Laboratory analysis, quality control or technical support','Materials, pharmaceutical, food, energy or environmental industries','Chemical-process or R&D roles with appropriate training','Research and some R&D roles often favour postgraduate study']},
      fit:PAIRS('适合喜欢实验、微观机制、精确记录和动手验证的人。','A good fit for students who enjoy experiments, microscopic mechanisms, precise records and hands-on verification.'),
      challenge:PAIRS('实验需要耐心和严格安全规范；理论、实验和数据解释会同时出现。','Laboratory work requires patience and safety discipline; theory, experiments and data interpretation are intertwined.'),
      compare:PAIRS('化学更关注物质与反应机制；化学工程通常更关注反应器、流程、规模与效率。','Chemistry focuses more on substances and reaction mechanisms; chemical engineering focuses more on reactors, processes, scale and efficiency.')},
    {id:'bio',match:/biological sciences|biology|life sciences|biochemistry|biomedical sciences|molecular biology|agricultural sciences|agriculture|food science and nutrition/i,
      intro:PAIRS('研究生命系统如何运行，从细胞、基因和分子到生物体与生态。生物医学或生物工程会进一步连接人体健康、技术或工程方法。','Studies living systems from cells, genes and molecules to organisms and ecosystems. Biomedical or bioengineering paths connect this knowledge with health and engineering.'),
      courses:{zh:['生命基础：细胞、生物分子、遗传和进化','实验与数据：实验设计、显微/分子技术和统计','系统层面：生理、生态、微生物或神经科学等','交叉主题：生物信息学、疾病机制、生物材料或医疗技术（依专业而异）'],en:['Life foundations: cells, biomolecules, genetics and evolution','Laboratory and data: experimental design, microscopy/molecular techniques and statistics','Systems: physiology, ecology, microbiology or neuroscience','Intersections may include bioinformatics, disease mechanisms, biomaterials or medical technology']},
      projects:{zh:['设计实验或整理公开生物数据','阅读研究图表，辨别样本、对照组与局限','将生命科学问题转化为可测试的小问题'],en:['Design an experiment or analyse public biological data','Interpret research figures, samples, controls and limitations','Turn a life-science question into a testable small study']},
      careers:{zh:['实验室/研究助理、质量检测或科学沟通','生物技术、制药、医疗器械或环境相关行业','生物信息学等交叉领域需补充编程与统计能力','临床医生、持证专业人员等通常需要另外的专业教育与资格'],en:['Laboratory/research assistant, quality testing or science communication','Biotechnology, pharmaceutical, medical-device or environmental industries','Interdisciplinary bioinformatics roles require added coding and statistics','Clinical and licensed professions require separate education and qualifications']},
      fit:PAIRS('适合对生命现象好奇、愿意读数据和研究论文，也能接受实验需要反复验证的人。','A good fit for students curious about living systems who are willing to interpret data and papers and repeat experiments.'),
      challenge:PAIRS('部分研究结论需要长时间验证；实验室、统计和专业术语需要逐步积累。','Some findings require lengthy validation; laboratory methods, statistics and technical vocabulary take time to build.'),
      compare:PAIRS('生命科学侧重理解生命机制；生物工程更强调用工程工具设计或改进产品、流程和技术。','Life sciences focuses on understanding biological mechanisms; bioengineering uses engineering tools to design or improve products and processes.')},
    {id:'medicine',match:/medicine|medical|clinical|dentistry|nursing|public health|pharmacy|pharmaceutical science|health sciences and technology/i,
      intro:PAIRS('围绕人体健康、疾病预防、诊断、治疗或药物展开。课程侧重点会随医学、药学、公共卫生等不同专业而显著变化。','Centres on health, disease prevention, diagnosis, treatment or medicines. Emphasis varies substantially across medicine, pharmacy and public health.'),
      courses:{zh:['人体基础：解剖、生理、细胞与疾病机制（依专业）','证据与方法：生物化学、药理、流行病学或统计','应用训练：病例、实验、社区健康或临床见习（依专业）','伦理与沟通：安全、患者/公众沟通、专业规范'],en:['Human foundations such as anatomy, physiology, cells and disease mechanisms, depending on field','Evidence and methods: biochemistry, pharmacology, epidemiology or statistics','Applied learning: cases, laboratories, community health or clinical placements, depending on programme','Ethics and communication: safety, patient/public communication and professional standards']},
      projects:{zh:['解读健康研究或公共卫生数据','以案例讨论证据、风险、沟通与伦理','药学方向可比较药物作用与安全信息；临床训练由合规课程安排'],en:['Interpret health research or public-health data','Discuss evidence, risk, communication and ethics through cases','Pharmacy-oriented work may compare medicine effects and safety; clinical training follows regulated programmes']},
      careers:{zh:['医学、药学、护理、公共卫生或健康研究等不同路径','医疗质量、健康数据、制药或医疗器械支持岗位','临床执业通常需要指定专业学位、资格考试和注册','科研或专科方向可能需要后续训练'],en:['Distinct paths in medicine, pharmacy, nursing, public health or health research','Healthcare quality, health data, pharmaceutical or medical-device support roles','Clinical practice typically requires the designated degree, exams and registration','Research or specialty paths may require further training']},
      fit:PAIRS('适合对健康问题有持续兴趣、重视责任与沟通，并能接受严谨训练的人。','A good fit for students with sustained interest in health, responsibility and communication who can commit to rigorous training.'),
      challenge:PAIRS('这是高度依专业和国家监管的领域；不能把某一健康专业的课程或资格直接套用到另一个专业。','This area is highly regulated by profession and country; one health degree’s curriculum or licence cannot be assumed for another.'),
      compare:PAIRS('医学、药学、护理和公共卫生并不互相替代；进入临床职业的教育与注册路径应单独核对。','Medicine, pharmacy, nursing and public health are not interchangeable. Education and registration routes for clinical careers must be checked separately.')},
    {id:'psych',match:/psychology|cognitive science|brain and cognitive|behavioural sciences|behavioral sciences|symbolic systems|neuroscience/i,
      intro:PAIRS('研究人如何思考、感受、学习和行动。心理学通常结合理论、观察、实验与统计，而不只是讨论性格或给别人贴标签。','Studies how people think, feel, learn and act. Psychology combines theory, observation, experiments and statistics, not just personality labels.'),
      courses:{zh:['心理基础：认知、发展、社会、人格或生物心理','研究方法：实验设计、测量、抽样与伦理','统计与数据：理解研究结果、效应大小和不确定性','应用方向：教育、组织、健康、神经或行为科学等'],en:['Foundations: cognitive, developmental, social, personality or biological psychology','Research methods: experiments, measurement, sampling and ethics','Statistics and data: interpreting findings, effect sizes and uncertainty','Applications in education, organisations, health, neuroscience or behavioural science']},
      projects:{zh:['设计问卷或实验并讨论偏差与伦理','批判性阅读心理学研究，而不是只看标题','将一个日常行为问题转化成可检验的研究问题'],en:['Design a survey or experiment and discuss bias and ethics','Critically read a psychology study rather than only its headline','Turn an everyday behaviour question into a testable research question']},
      careers:{zh:['研究助理、用户研究或行为洞察','人力资源、教育项目或组织发展相关岗位','市场研究、服务设计或健康项目支持','临床心理等受监管职业通常需要研究生阶段和当地资格'],en:['Research assistant, user research or behavioural insights','Human resources, education programmes or organisational development','Market research, service design or health-programme support','Regulated clinical psychology usually requires postgraduate training and local credentials']},
      fit:PAIRS('适合喜欢问“为什么人会这样做”、愿意研究证据并认真对待伦理的人。','A good fit for students who ask why people behave as they do, examine evidence and take ethics seriously.'),
      challenge:PAIRS('人的行为有情境和个体差异；研究结论很少能简单地套用到每个人。','Behaviour varies by person and context; findings rarely apply identically to everyone.'),
      compare:PAIRS('心理学更重研究方法和行为证据；认知科学通常更跨学科，可能更多连接计算机、语言和神经科学。','Psychology places strong emphasis on methods and behavioural evidence; cognitive science is often more interdisciplinary with computing, language and neuroscience.')},
    {id:'engineering',match:/engineering|aeronautics|aerospace|mechanical|electrical|electronic|civil|transportation|water resources|microelectronics|automation|materials science|energy science|applied science/i,
      intro:PAIRS('用数学、科学和设计方法解决现实中的技术问题。不同工程专业分别关注机械、电路、结构、材料、能源、航空或大型系统。','Uses mathematics, science and design to solve practical technical problems. Specialties focus on areas such as machines, circuits, structures, materials, energy, aerospace or large systems.'),
      courses:{zh:['数学与科学：微积分、物理、建模和基础计算','工程基础：按专业学习电路、力学、材料、流体或控制','设计与分析：计算、仿真、测量、实验和优化','工程实践：团队设计、原型、报告、安全与可持续性'],en:['Mathematics and science: calculus, physics, modelling and computing foundations','Engineering fundamentals such as circuits, mechanics, materials, fluids or control','Design and analysis: computation, simulation, measurement, experiments and optimisation','Practice: team design, prototypes, reporting, safety and sustainability']},
      projects:{zh:['设计并测试一个原型，比较性能和限制','用仿真或实验数据解释系统为什么表现如此','平衡成本、可靠性、安全、材料和环境影响'],en:['Design and test a prototype, comparing performance and limits','Use simulation or experimental data to explain system behaviour','Balance cost, reliability, safety, materials and environmental impact']},
      careers:{zh:['工程设计、测试、制造或系统工程','研发、质量、项目或技术咨询','能源、交通、建筑、航空、电子或材料等对应行业','特定工程执业资格和认证需按所在地区与专业核对'],en:['Engineering design, testing, manufacturing or systems engineering','R&D, quality, projects or technical consulting','Relevant sectors such as energy, transport, construction, aerospace, electronics or materials','Professional licensing and accreditation depend on specialty and jurisdiction']},
      fit:PAIRS('适合喜欢把理论用于具体问题、制作和测试东西，并愿意兼顾数学、团队合作与约束条件的人。','A good fit for students who like applying theory, building and testing things, and balancing mathematics, teamwork and constraints.'),
      challenge:PAIRS('需要把精度、成本、安全和使用环境放在一起考虑；理论课与项目工作都会有压力。','You must consider accuracy, cost, safety and operating conditions together. Both theory and project work can be demanding.'),
      compare:PAIRS('工程通常更强调把科学知识转化成可用的设计或系统；物理更偏解释自然现象，计算机科学更聚焦计算系统。','Engineering usually turns scientific knowledge into usable designs or systems; physics explains nature and computer science focuses on computation.')},
    {id:'architecture',match:/architecture|urban planning|urban and rural planning|urban science|landscape architecture|city planning|built environment/i,
      intro:PAIRS('研究人如何使用建筑与城市空间，并把功能、美感、结构、材料、环境和使用者需求结合到设计中。','Studies how people use buildings and urban spaces, combining function, aesthetics, structure, materials, environment and user needs.'),
      courses:{zh:['空间与设计：比例、动线、模型、绘图与表达','建筑历史与理论：理解不同形式背后的背景','结构、材料与环境：建筑怎样站立、采光、通风和节能','城市与场地：社区、规划、景观、法规与使用者需求'],en:['Space and design: proportion, circulation, models, drawing and presentation','History and theory behind different built forms','Structures, materials and environment: stability, daylight, ventilation and energy','Urban and site contexts: communities, planning, landscape, rules and users']},
      projects:{zh:['围绕真实场地完成概念方案、图纸或模型','收集使用者需求，并解释方案如何回应它们','在空间、预算、可持续性与规范之间做取舍'],en:['Develop a concept, drawings or model for a real site','Gather user needs and explain how the design responds','Balance space, budget, sustainability and regulations']},
      careers:{zh:['建筑/城市/景观相关设计助理或规划支持','建筑可视化、空间设计、城市研究','可持续设计、地产或建成环境相关项目','成为注册建筑师或规划专业人员通常有额外学历/实践/注册要求'],en:['Architecture, urban or landscape design assistance and planning support','Architectural visualisation, spatial design or urban research','Sustainable design, property or built-environment projects','Architect or planner registration often requires additional study, practice and registration']},
      fit:PAIRS('适合兼顾视觉想象、空间思维、用户需求和反复修改的人。','A good fit for students who combine visual imagination, spatial thinking, user needs and iterative revision.'),
      challenge:PAIRS('作品集、设计评图、绘图/模型与技术约束可能耗时；审美之外还需理解规范和可行性。','Portfolios, critiques, drawings/models and technical constraints take time; feasibility and standards matter as much as aesthetics.'),
      compare:PAIRS('建筑设计更综合地整合空间与使用者；土木工程更深入结构和基础设施的工程分析。','Architecture integrates space and users, while civil engineering goes deeper into the engineering analysis of structures and infrastructure.')},
    {id:'design',match:/design|art, design|creative media|media design/i,
      intro:PAIRS('用研究、创意和原型改善产品、服务、视觉传播或数字体验。设计不只是外观，也要考虑使用者、目的和限制。','Uses research, creativity and prototyping to improve products, services, visual communication or digital experiences. Design is more than appearance.'),
      courses:{zh:['设计基础：构图、视觉语言、材料或交互原理','用户与研究：观察、访谈、需求定义和测试','原型与迭代：草图、模型、数字工具和反馈','设计实践：作品集、表达、团队合作和项目管理'],en:['Design foundations: composition, visual language, materials or interaction principles','User research: observation, interviews, problem framing and testing','Prototyping and iteration: sketches, models, digital tools and feedback','Practice: portfolio, presentation, teamwork and project management']},
      projects:{zh:['为一个明确用户问题设计并测试方案','制作可点击原型、产品模型或视觉作品','用用户反馈记录修改过程，而不是只展示成品'],en:['Design and test a solution for a specific user problem','Create a clickable prototype, product model or visual piece','Use user feedback to document iterations, not just the final product']},
      careers:{zh:['产品/体验/交互或视觉设计（依方向和作品集）','服务设计、内容与品牌、创意技术','用户研究、设计运营或相关项目协调','职业入口通常高度依赖作品集、实践和具体工具能力'],en:['Product, experience, interaction or visual design depending on focus and portfolio','Service design, content/brand or creative technology','User research, design operations or project coordination','Entry routes often depend heavily on portfolio, practice and tools']},
      fit:PAIRS('适合喜欢观察体验、快速做原型、接受反馈并不断迭代的人。','A good fit for students who observe experiences, prototype quickly, accept feedback and iterate.'),
      challenge:PAIRS('创意需要研究和验证；项目评价常有主观部分，但仍需解释决策依据。','Creativity needs research and validation. Critique can be subjective, but decisions still need justification.'),
      compare:PAIRS('设计重视用户体验与方案表达；纯艺术可能更偏个人表达，工程则更侧重技术性能与约束。','Design emphasises user experience and communicating solutions; fine art may focus more on expression, while engineering prioritises technical performance.')},
    {id:'law',match:/law|legal|computing & law/i,
      intro:PAIRS('学习法律规则如何形成、解释和应用，训练从复杂材料中找出争点、分析证据并构建有逻辑的论证。','Studies how legal rules are created, interpreted and applied, training students to identify issues, analyse evidence and build reasoned arguments.'),
      courses:{zh:['法律体系与方法：法律推理、案例阅读和法律写作','核心领域：合同、侵权、刑法、公法或宪法等（依法域/课程）','研究与论证：法规检索、判例分析、证据和反方观点','应用主题：商业、科技、知识产权、国际法或人权等'],en:['Legal systems and method: reasoning, cases and legal writing','Core areas such as contract, tort, criminal, public or constitutional law, depending on jurisdiction','Research and argument: statutes, case analysis, evidence and counterarguments','Applications such as business, technology, intellectual property, international law or human rights']},
      projects:{zh:['围绕案例写一份有依据的法律分析','比较两个判决的理由、事实和适用原则','模拟谈判或辩论，准确回应反方观点'],en:['Write an evidence-based legal case analysis','Compare the facts, reasoning and principles of two decisions','Practise negotiation or debate while responding accurately to counterarguments']},
      careers:{zh:['法律研究、合规、合同或政策支持','企业、公共部门、非营利机构的法律相关岗位','律师/法官等职业通常需符合当地法学教育、考试与注册规则','法律与科技、政策或商业的交叉岗位'],en:['Legal research, compliance, contracts or policy support','Legal-related roles in companies, public bodies or non-profits','Solicitor/barrister/judicial routes require jurisdiction-specific education, exams and registration','Cross-disciplinary roles in law and technology, policy or business']},
      fit:PAIRS('适合喜欢细读文本、构建论证、关注规则与公平，并愿意写作和修改的人。','A good fit for students who enjoy close reading, argument, rules and fairness, and are willing to write and revise.'),
      challenge:PAIRS('法律很依赖国家/地区；同一个法律概念在不同法域可能含义不同。阅读与写作工作量常较大。','Law is jurisdiction-specific; a concept can mean different things across legal systems. Reading and writing workloads can be substantial.'),
      compare:PAIRS('法律强调规则解释与论证；政治学/公共政策更多分析制度、行为和政策效果。','Law emphasises rules and argument; politics and public policy more often analyse institutions, behaviour and policy effects.')},
    {id:'social',match:/social sciences|political science|public policy|international relations|global studies|human social|sociology|public administration|social work|political economy/i,
      intro:PAIRS('研究社会、制度、群体与公共决策如何相互影响。不同专业可能偏政治、国际关系、社会结构、政策评估或社区实践。','Studies how society, institutions, groups and public decisions influence one another, with different programmes focusing on politics, relations, social structures, policy or community practice.'),
      courses:{zh:['理论与制度：国家、组织、权力和社会结构','研究方法：访谈、调查、档案、比较研究或统计','政策与现实议题：教育、住房、健康、环境或不平等','表达与分析：证据论证、写作、数据解释和政策评估'],en:['Theory and institutions: states, organisations, power and social structure','Methods: interviews, surveys, archives, comparative research or statistics','Policy topics such as education, housing, health, environment or inequality','Analysis and communication: evidence, writing, data interpretation and evaluation']},
      projects:{zh:['比较两地对同一社会问题的不同政策','设计调查/访谈方案并讨论样本限制','使用公开数据和研究文献评估一个政策主张'],en:['Compare two places’ policies on the same social issue','Design a survey/interview plan and discuss sampling limits','Use public data and research to evaluate a policy claim']},
      careers:{zh:['政策/项目研究和公共事务支持','非营利、社区、教育或国际项目协调','市场/用户研究、公共沟通或咨询支持','数据和定量分析能力有助于进入更广的分析岗位'],en:['Policy or programme research and public-affairs support','Non-profit, community, education or international-programme coordination','Market/user research, public communication or consulting support','Quantitative and data skills can open broader analytical roles']},
      fit:PAIRS('适合对社会议题有真实好奇心、愿意比较多种解释并用可靠证据写清观点的人。','A good fit for students genuinely curious about social questions who compare explanations and support claims with evidence.'),
      challenge:PAIRS('社会现象通常多因素共同作用；研究需要小心区分相关关系、因果关系和个人价值判断。','Social outcomes usually have multiple causes. Research must distinguish correlation, causation and personal value judgements.'),
      compare:PAIRS('社会科学往往更关注制度、群体和公共问题；心理学通常更集中于个体行为与心理过程。','Social sciences often focus on institutions, groups and public issues; psychology focuses more on individual behaviour and mental processes.')},
    {id:'humanities',match:/philosophy|history|english|literature|arts|humanities|journalism|communication|media|chinese language|journalism|cultural studies/i,
      intro:PAIRS('通过文本、历史材料、文化作品和论证理解人类如何表达意义、建立观念和解释世界。专业之间会在写作、历史、伦理或媒体实践上有不同侧重。','Uses texts, historical evidence, cultural works and argument to understand how people create meaning and interpret the world.'),
      courses:{zh:['阅读与解释：分析文本、历史材料或文化作品','论证与写作：提出主张、引用证据并回应不同观点','历史与文化语境：理解观念和作品产生的背景','专业方法：档案、媒体制作、伦理分析或语言研究（依方向）'],en:['Reading and interpretation of texts, historical evidence or cultural works','Argument and writing: claims, evidence and counterarguments','Historical and cultural context','Methods such as archives, media production, ethical analysis or language study, depending on focus']},
      projects:{zh:['写一篇基于来源的分析论文或评论','对比不同历史记述/媒体报道如何选择证据','制作采访、文章、展览或文化分析项目（依专业）'],en:['Write a source-based analytical essay or critique','Compare how historical accounts or media reports select evidence','Create an interview, article, exhibition or cultural analysis project']},
      careers:{zh:['编辑、内容、传播、媒体或研究支持','文化机构、教育、公共沟通或非营利项目','政策、市场研究或咨询中的写作与分析岗位','实践经验、作品和额外技能会显著影响就业方向'],en:['Editing, content, communications, media or research support','Cultural institutions, education, public communication or non-profit programmes','Writing and analysis roles in policy, market research or consulting','Experience, portfolio and complementary skills strongly shape career options']},
      fit:PAIRS('适合喜欢深入阅读、提出问题、论证观点并关注语言和文化的人。','A good fit for students who enjoy close reading, asking questions, arguing carefully and examining language and culture.'),
      challenge:PAIRS('需要大量阅读、写作与修订；职业路径常不像某些专业那样直接，需要主动积累作品和实践。','It often involves substantial reading and revision. Career paths may be less direct, so practical experience and a portfolio matter.'),
      compare:PAIRS('人文学科主要训练解释、语境和论证；社会科学通常更系统地研究社会行为与制度，也可能更重调查数据。','Humanities emphasise interpretation, context and argument; social sciences more systematically study behaviour and institutions, often with survey data.')},
    {id:'environment',match:/environment|sustainability|earth science|earth and climate sciences|geology|environmental science/i,
      intro:PAIRS('研究自然系统与人类活动怎样相互影响，包括气候、资源、生态、污染和可持续发展问题。课程会结合科学、数据和政策。','Studies how natural systems and human activity interact, including climate, resources, ecosystems, pollution and sustainability.'),
      courses:{zh:['自然科学基础：生态、地球系统、化学或物理（依专业）','测量与数据：野外调查、实验、统计和地理信息工具','系统问题：气候、能源、水、土地或污染','应用与治理：影响评估、风险、政策和可持续设计'],en:['Science foundations: ecology, Earth systems, chemistry or physics depending on field','Measurement and data: fieldwork, experiments, statistics and geospatial tools','Systems such as climate, energy, water, land or pollution','Applications: impact assessment, risk, policy and sustainable design']},
      projects:{zh:['分析某地区的环境数据或资源问题','进行场地观察、采样规划或 GIS 地图分析','比较不同方案的环境影响和现实限制'],en:['Analyse environmental data or resource issues in a place','Conduct site observation, sampling design or GIS mapping','Compare impacts and practical constraints of different options']},
      careers:{zh:['环境监测、可持续发展或影响评估支持','能源、水务、咨询或公共政策相关岗位','GIS、环境数据或生态研究助理','特定专业顾问/执业角色可能需要额外技术训练或资格'],en:['Environmental monitoring, sustainability or impact-assessment support','Energy, water, consulting or public-policy roles','GIS, environmental data or ecological research assistance','Specialist consultancy roles may need additional technical training or credentials']},
      fit:PAIRS('适合对自然与社会交叉问题感兴趣、愿意整合数据和现实约束的人。','A good fit for students interested in problems at the intersection of nature and society and willing to integrate data and constraints.'),
      challenge:PAIRS('问题往往跨学科，数据尺度、地区背景和政策执行会影响结论。','Problems are often interdisciplinary, and scale, local context and policy implementation affect conclusions.'),
      compare:PAIRS('环境科学较重系统理解与证据；环境工程更强调设计技术方案以控制、处理或优化系统。','Environmental science emphasises system understanding and evidence; environmental engineering emphasises technical designs to control or improve systems.')},
    {id:'fintech',match:/fintech|applied computing in finance/i,
      intro:PAIRS('把金融业务和计算机技术放在同一张地图里：既理解支付、银行、投资和风险，也学习用数据、软件与自动化解决金融场景中的问题。','Combines finance with computing: understand payments, banking, investments and risk while learning to use data, software and automation in financial settings.'),
      courses:{zh:['金融基础：金融市场、企业金融、投资与风险概念','计算基础：编程、算法、数据库与软件工程','数据与建模：统计分析、预测、金融数据和决策支持','交叉应用：数字银行、支付、金融分析、区块链或金融安全（依课程方向而异）'],en:['Finance foundations: markets, corporate finance, investments and risk','Computing foundations: programming, algorithms, databases and software engineering','Data and modelling: analytics, prediction, financial data and decision support','Applications may include digital banking, payments, financial analytics, blockchain or security']},
      projects:{zh:['设计一个虚拟支付/预算产品原型，说明用户流程和风险控制','用公开数据完成一份金融数据分析，并标明数据局限','画出一个金融业务流程，提出可自动化的环节并评估潜在风险'],en:['Prototype a simulated payment or budgeting product with user flows and risk controls','Analyse public financial data and document its limits','Map a financial process, identify automation opportunities and assess risks']},
      careers:{zh:['金融科技产品、产品运营或业务分析','金融机构或 FinTech 公司的数据分析、数字化转型支持','金融软件、数据工具或自动化解决方案','风险、合规和安全相关工作通常需要对应的行业知识与岗位训练'],en:['Fintech product, product operations or business analysis','Data analytics or digital-transformation support in financial institutions or fintech firms','Financial software, data tools or automation solutions','Risk, compliance and security roles require domain-specific training']},
      fit:PAIRS('适合同时愿意学金融业务、编程与数据分析，并对“技术怎样改变金融服务”感兴趣的人。','A good fit for students willing to learn finance, coding and analytics, and curious about how technology changes financial services.'),
      challenge:PAIRS('它不是只学投资，也不是只写代码；还要理解数据隐私、金融风险、用户保护和监管环境。','It is neither only investing nor only coding. Privacy, financial risk, user protection and regulation also matter.'),
      compare:PAIRS('相比纯金融，它通常更重编程和系统；相比计算机科学，它更深入金融场景、产品流程和风险。','Compared with finance alone, it usually adds more coding and systems; compared with computer science, it focuses more on financial workflows, products and risk.')},
    {id:'bioengineering',match:/bioengineering|biomedical engineering|biological engineering/i,
      intro:PAIRS('把生命科学与工程方法结合，用来设计、测试或改进医疗设备、生物材料、诊断技术、实验方法或其他生物相关系统。','Combines life sciences and engineering to design, test or improve medical devices, biomaterials, diagnostic technologies and biological systems.'),
      courses:{zh:['数学、物理与编程：支撑定量分析和工程设计','生物基础：细胞、生理、生物分子或疾病相关知识','工程核心：材料、力学、电子/传感、建模或控制（依方向）','设计与验证：实验、原型、测量、安全和医疗/生物伦理'],en:['Mathematics, physics and computing for quantitative analysis and engineering design','Biology foundations such as cells, physiology, biomolecules or disease-related concepts','Engineering core such as materials, mechanics, electronics/sensors, modelling or control','Design and validation through experiments, prototypes, measurement, safety and bioethics']},
      projects:{zh:['设计一个概念性健康监测设备并说明测量限制','分析一种生物材料或诊断方法的性能指标','用实验数据验证原型，并讨论安全、可用性和样本局限'],en:['Design a conceptual health-monitoring device and explain measurement limits','Analyse performance metrics for a biomaterial or diagnostic method','Validate a prototype with data and discuss safety, usability and sample limits']},
      careers:{zh:['医疗器械、生物技术或制药行业的工程/研发支持','实验室、质量、产品验证或技术项目岗位','生物信息学、医学影像或健康技术等交叉方向','独立研发和研究型岗位可能需要研究生训练'],en:['Engineering or R&D support in medical devices, biotech or pharmaceuticals','Laboratory, quality, product-validation or technical-project roles','Interdisciplinary areas such as bioinformatics, medical imaging or health technology','Independent R&D and research roles may need postgraduate study']},
      fit:PAIRS('适合对人体/生命系统好奇，也喜欢物理、数学、设计和动手验证的人。','A good fit for students curious about living systems who also enjoy physics, mathematics, design and testing.'),
      challenge:PAIRS('课程可能横跨多门学科；真实医疗应用还受安全、伦理、法规和临床证据约束。','The curriculum can span multiple disciplines. Real medical applications are constrained by safety, ethics, regulation and clinical evidence.'),
      compare:PAIRS('比生物学更强调工程设计与性能验证；比传统工程更需要理解生物系统和医学情境。','More focused on engineering design and validation than biology, and more biologically grounded than traditional engineering.')},
    {id:'statistics',match:/statistics|statistical|actuarial science/i,
      intro:PAIRS('学习怎样从有限、带有噪声的数据中作出合理判断。统计学重视不确定性、模型假设和证据质量；精算方向还会把概率与风险应用到保险和长期财务问题。','Studies how to reason from limited, noisy data. Statistics centres on uncertainty, assumptions and evidence; actuarial study applies probability and risk to insurance and long-term financial questions.'),
      courses:{zh:['概率基础：随机事件、分布和期望','统计推断：抽样、估计、区间、假设检验和实验设计','建模与计算：回归、预测、统计软件和数据处理','方向选修：机器学习、实验、时间序列，或精算的风险/保险模型'],en:['Probability: random events, distributions and expectations','Statistical inference: sampling, estimation, intervals, tests and experimental design','Modelling and computing: regression, prediction, statistical software and data processing','Electives may include machine learning, experiments, time series or actuarial risk/insurance models']},
      projects:{zh:['分析抽样偏差对调查结论的影响','用回归模型回答问题，并检查模型假设','精算方向可建立简化风险情景，比较不同假设的结果'],en:['Assess how sampling bias affects a survey conclusion','Use regression to answer a question and check model assumptions','Actuarial-oriented work can model simplified risk scenarios under different assumptions']},
      careers:{zh:['统计/数据分析、实验设计或研究支持','风险、保险、定价或业务分析（精算岗位有额外资格要求）','质量、运营、政策或医疗研究中的定量分析','数据科学、计量经济或研究生统计方向'],en:['Statistical/data analysis, experimental design or research support','Risk, insurance, pricing or business analysis; actuarial roles have additional credential requirements','Quantitative analysis in quality, operations, policy or health research','Data science, econometrics or postgraduate statistics']},
      fit:PAIRS('适合愿意细看证据、理解误差并反复检查“这个结果有多可靠”的人。','A good fit for students who examine evidence, understand error and repeatedly ask how reliable a result is.'),
      challenge:PAIRS('统计结论依赖数据质量和假设；复杂公式背熟不等于知道何时能使用。','Statistical conclusions depend on data quality and assumptions; memorising formulas is not the same as knowing when they apply.'),
      compare:PAIRS('统计学更重不确定性、推断与方法基础；数据科学通常把这些方法放进更完整的数据处理和计算流程。','Statistics focuses more deeply on uncertainty, inference and methods; data science often embeds these in a broader data-processing and computing workflow.')},

      projects:{zh:['分析一组实验或公开科学数据，并说明测量误差','用可靠文献比较两个科学解释，区分证据与假设','设计一个跨学科小项目，说明方法、结果和局限'],en:['Analyse experimental or public scientific data and explain measurement error','Compare two scientific explanations using reliable literature, separating evidence from assumptions','Design a small interdisciplinary project and explain methods, findings and limitations']},

      fit:PAIRS('适合对自然规律有好奇心、愿意用证据和方法验证想法，同时还在探索具体科学方向的人。','A good fit for students curious about how the natural world works, willing to test ideas with evidence, and still exploring a specific science field.'),

      compare:PAIRS('专门的生物、化学或物理专业通常会更早深入单一学科；宽口径理科可能提供更多组合空间，但也更需要主动规划方向。','A dedicated biology, chemistry or physics degree usually goes deeper into one field earlier. A broad science degree may offer more flexibility, but requires more deliberate pathway planning.')},

  function chooseProfile(major){
    const m=String(major||'').toLowerCase().replace(/&/g,'and');
    const byId=id=>profiles.find(p=>p.id===id)||profiles[profiles.length-1];
    // Prioritise hybrid and narrower fields before broad substring matches.
    if(/fintech|applied computing in finance/.test(m))return byId('fintech');
    if(/advertising|marketing|market research/.test(m))return byId('business');
    if(/business analytics|business intelligence|operations research|management science/.test(m))return byId('analytics');
    if(/bioengineering|biomedical engineering|biological engineering/.test(m))return byId('bioengineering');
    if(/actuarial science|\bstatistics\b|statistical/.test(m))return byId('statistics');

  function view(activity,state){
    const t=copy();
    if(!state||state.state==='loading')return `<div class="path-activity-live"><div class="path-activity-live-head"><div><div class="kicker">48H OFFICIAL SOURCE</div><h3>${esc(t.title)}</h3></div></div><p class="path-activity-live-loading">${esc(t.loading)}</p><div class="path-activity-live-note">${esc(t.policy)}</div></div>`;
    if(state.state==='error')return `<div class="path-activity-live"><div class="path-activity-live-head"><h3>${esc(t.title)}</h3><span class="path-activity-live-badge stale">${esc(t.stale)}</span></div><div class="path-activity-live-note">${esc(t.failed)}</div><button class="path-activity-live-retry" type="button" onclick="pathRetryActivityDetails()">${esc(t.retry)}</button><a href="${esc(activity.url)}" target="_blank" rel="noopener noreferrer">${esc(t.source)} ↗</a></div>`;
    const p=state.payload,f=p.freshness||{},facts=Array.isArray(p.facts)?p.facts:[],stale=!!f.stale;
    return `<div class="path-activity-live"><div class="path-activity-live-head"><div><div class="kicker">48H OFFICIAL SOURCE</div><h3>${esc(t.title)}</h3></div><span class="path-activity-live-badge ${stale?'stale':''}">${esc(stale?t.stale:t.fresh)}</span></div><div class="path-activity-live-meta"><span>${esc(t.retrieved)}：${esc(fmt(f.retrievedAt))}</span><span>${esc(t.refresh)}：${esc(fmt(f.expiresAt))}</span></div>${facts.length?`<div class="path-activity-live-facts">${facts.map(fact=>`<div class="path-activity-live-fact"><b>${esc(fieldLabel(fact.field))}</b><p>${esc(fact.evidenceText||fact.value||'')}</p><small>${esc(t.checked)}</small></div>`).join('')}</div>`:`<div class="path-activity-live-note">${esc(t.empty)}</div>`}<div class="path-activity-live-note">${esc(t.policy)}</div><a href="${esc(p.source?.url||activity.url)}" target="_blank" rel="noopener noreferrer">${esc(t.source)} ↗</a></div>`;
  }
  async function load(activity,force=false){
    const id=String(activity.id||''),existing=states[id];
    if(!force&&existing?.state==='loading')return;
    if(!force&&existing?.state==='ready'&&Date.parse(existing.payload?.freshness?.expiresAt||0)>Date.now()){mount();return}
    states[id]={state:'loading',payload:null};mount();
    try{const response=await fetch(`/api/activity-details?id=${encodeURIComponent(id)}`);const payload=await response.json().catch(()=>({}));if(!response.ok||!payload?.activity)throw new Error(payload?.error||`HTTP ${response.status}`);states[id]={state:'ready',payload};}
    catch(error){states[id]={state:'error',error:String(error?.message||'activity_details_failed')};}
    mount();
  }
  function mount(){
    if(S.page!=='activity')return;const activity=currentActivity();if(!activity?.id)return;
    const first=document.querySelector('#app .detail > div:first-child > .card');if(!first)return;
    let host=document.querySelector('#app [data-live-activity-details]');if(!host){first.insertAdjacentHTML('afterend','<div data-live-activity-details></div>');host=document.querySelector('#app [data-live-activity-details]')}
    host.innerHTML=view(activity,states[String(activity.id)]);
    const state=states[String(activity.id)];if(!state||state.state==='error'||(state.state==='ready'&&Date.parse(state.payload?.freshness?.expiresAt||0)<=Date.now()))queueMicrotask(()=>load(activity));
  }
  window.pathRetryActivityDetails=()=>{const a=currentActivity();if(a){delete states[String(a.id)];load(a,true)}};
  const priorRender=window.render;
  window.render=function(){if(['compare','consultant'].includes(S.page))S.page='plan';const result=priorRender.apply(this,arguments);mount();return result};
  window.PATH_LIVE_ACTIVITY_V79={version:'V79',ttlHours:48,endpoint:'/api/activity-details',registryOnly:true,autoDiscovery:false};
  try{mount()}catch(error){console.error('Path live activity initialisation failed',error)}
})();
</script>
</body>
</html>
