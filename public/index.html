/* Path V28 — Apple-inspired premium visual refinement */
:root{
  --bg:#f5f5f7;
  --card:rgba(255,255,255,.88);
  --text:#1d1d1f;
  --muted:#6e6e73;
  --line:rgba(0,0,0,.08);
  --soft:#f2f2f7;
  --accent:#0071e3;
  --blue:#0071e3;
  --purple:#8b5cf6;
  --green:#248a3d;
  --amber:#b06b00;
  --red:#d70015;
  --ink:#1d1d1f;
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(900px 500px at 8% -10%,rgba(0,113,227,.10),transparent 60%),
    radial-gradient(800px 480px at 95% 0%,rgba(139,92,246,.08),transparent 60%),
    #f5f5f7;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.app{max-width:1180px;padding:20px 18px 72px}
.top{margin-bottom:16px}
.brand{
  font-size:28px;
  font-weight:750;
  letter-spacing:-1.2px;
}
.brand span{font-size:11px;color:#86868b;font-weight:500}
.nav{
  gap:7px;
  margin-bottom:24px;
  padding:5px;
  border:1px solid rgba(0,0,0,.06);
  border-radius:18px;
  background:rgba(255,255,255,.68);
  box-shadow:0 8px 30px rgba(0,0,0,.045);
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
}
.nav button{
  border:0;
  background:transparent;
  color:#515154;
  padding:10px 15px;
  font-weight:600;
  transition:transform .18s ease,background .18s ease,color .18s ease;
}
.nav button:hover{transform:translateY(-1px);background:rgba(0,0,0,.045)}
.nav button.active{background:#1d1d1f;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.hero{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#111214 0%,#1d1d1f 58%,#24262b 100%);
  border:1px solid rgba(255,255,255,.08);
  border-radius:32px;
  padding:42px;
  box-shadow:0 28px 80px rgba(0,0,0,.12);
}
.hero:before{
  content:"";
  position:absolute;
  width:420px;height:420px;
  right:-150px;top:-220px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.13),transparent 65%);
  pointer-events:none;
}
.hero h1{
  position:relative;
  font-size:46px;
  line-height:1.03;
  letter-spacing:-2px;
  font-weight:720;
}
.hero p{position:relative;color:#d2d2d7}
.hero .btn{position:relative}
.btn,.chip,.lang button,.major{
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease;
}
.btn:hover,.chip:hover,.major:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}.btn.primary{
  box-shadow:0 8px 24px rgba(0,0,0,.14);
}
.stats{gap:12px}
.stat,.card,.gate-card,.empty{
  background:rgba(255,255,255,.88);
  border:1px solid rgba(0,0,0,.065);
  box-shadow:0 8px 28px rgba(0,0,0,.045);
  backdrop-filter:saturate(150%) blur(18px);
  -webkit-backdrop-filter:saturate(150%) blur(18px);
}
.stat{border-radius:20px;padding:17px}
.stat b{font-size:24px;letter-spacing:-.5px}
.section{margin-top:22px}
.head h2{font-size:25px;letter-spacing:-.7px;font-weight:700}
.search input,.search select,.gate input{
  background:rgba(255,255,255,.9);
  border:1px solid rgba(0,0,0,.09);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
  transition:border-color .18s ease,box-shadow .18s ease;
}
.search input:focus,.search select:focus,.gate input:focus{
  border-color:rgba(0,113,227,.45);
  box-shadow:0 0 0 4px rgba(0,113,227,.10);
}
.card{
  border-radius:22px;
  padding:19px;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 40px rgba(0,0,0,.075);
  border-color:rgba(0,0,0,.10);
}
.uni{cursor:pointer}
.major-list{gap:10px}
.major{
  border:1px solid rgba(0,0,0,.08);
  background:rgba(255,255,255,.92);
  border-radius:16px;
  padding:15px;
}
.major:hover{
  border-color:rgba(0,113,227,.28);
  box-shadow:0 8px 24px rgba(0,113,227,.08);
}
.activity-card{
  border:1px solid rgba(0,0,0,.075);
  background:rgba(255,255,255,.94);
  border-radius:18px;
  box-shadow:0 6px 22px rgba(0,0,0,.035);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.activity-card:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 34px rgba(0,0,0,.075);
  border-color:rgba(0,113,227,.22);
}
.activity-real{border-left:4px solid #248a3d}
.activity-evidence{border-left:4px solid #8b5cf6}
.source{color:#0071e3}
.source-badge{background:#f2f2f7;border-color:rgba(0,0,0,.06)}
.verified-source{background:#edf7ee;color:#248a3d;border-color:#d7ecd9}
.zone,.zone-recommend,.zone-plan,.zone-insight{
  border:1px solid rgba(0,0,0,.055);
  border-radius:22px;
  box-shadow:0 10px 32px rgba(0,0,0,.045);
}
.zone:after,.zone-recommend:after,.zone-plan:after,.zone-insight:after{display:none}
.zone{background:linear-gradient(180deg,#f7faff,#fff)}
.zone-recommend{background:linear-gradient(180deg,#faf8ff,#fff)}
.zone-plan{background:linear-gradient(180deg,#f6fbf8,#fff)}
.zone-insight{background:linear-gradient(180deg,#fffaf2,#fff)}
.pill,.type,.source-badge{
  border-color:rgba(0,0,0,.06);
  background:#f2f2f7;
}
.footer{color:#86868b}
.kicker{text-transform:none;letter-spacing:.01em;color:#86868b}
.gate{
  min-height:calc(100vh - 70px);
  background:transparent;
}
.gate-card{
  border-radius:32px;
  padding:38px;
  box-shadow:0 24px 80px rgba(0,0,0,.08);
}
.gate-brand{font-weight:750;letter-spacing:-1.2px}
.gate h1{font-weight:720;letter-spacing:-1.5px}
.lang-choice,.choice-chip{
  background:rgba(255,255,255,.88);
  border-color:rgba(0,0,0,.07);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.lang-choice:hover,.choice-chip:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 24px rgba(0,0,0,.06);
}
.lang-choice.active,.choice-chip.selected{cursor:pointer;
  background:#1d1d1f;
  border-color:#1d1d1f;
  box-shadow:0 8px 22px rgba(0,0,0,.12);
}
.danger-reset{box-shadow:0 6px 18px rgba(215,0,21,.12)}
@media(max-width:800px){
  .hero{padding:30px}
  .hero h1{font-size:36px}
}
@media(max-width:500px){
  .app{padding:14px 12px 48px}
  .hero{padding:25px;border-radius:25px}
  .hero h1{font-size:32px;letter-spacing:-1.3px}
  .card{border-radius:19px}
  .gate-card{padding:26px;border-radius:26px}
}


/* V29 product layer — Path Match / Next Move / Compare / Journey */
.v29-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.v29-card{background:rgba(255,255,255,.82);border:1px solid rgba(20,20,20,.08);border-radius:24px;padding:20px;box-shadow:0 10px 35px rgba(0,0,0,.045);backdrop-filter:blur(16px)}

function dedupe(items){
  const seen=new Set();
  return (Array.isArray(items)?items:[]).filter(item=>{
    const key=(item&&typeof item==='object')?String(item.id||item.key||item.name||JSON.stringify(item)):String(item);
    if(seen.has(key)) return false;
    seen.add(key); return true;
  });
}

function scopedProgramActivities(uni,major){
  const key=uni+'|'+major;
  const names=PROGRAM_ACTIVITY_RULES[key]||[];
  const pool=UNIVERSITY_ACTIVITY_OVERRIDES[uni]||[];
  return pool.filter(a=>{
    const explicit=a.programmeRoutes?.[uni]?.includes(major);
    return explicit || names.includes(a.name);
  }).map(a=>({...a,programKey:key,programScoped:true,routeUniversity:uni,routeMajor:major,score:null}));
}
function routeMatchesActivity(a,uni,major){
  const list=a.programmeRoutes?.[uni];
  return Array.isArray(list)&&list.includes(major);
}
function activityRouteLabel(a,uni,major){
  if(routeMatchesActivity(a,uni,major)) return 'programme';
  if((a.universities||[]).includes(uni)) return 'university';
  return 'evidence';
}

function parseActivityKey(k){
  let v=String(k||'');
  for(let i=0;i<3;i++){
    try{ const parsed=JSON.parse(v); if(parsed && typeof parsed==='object') return parsed; }catch(e){}
    try{ const next=decodeURIComponent(v); if(next===v) break; v=next; }catch(e){ break; }
  }
  return null;
}
function decodeActivityArg(v){
  let x=String(v||'');
  for(let i=0;i<3;i++){ try{ const n=decodeURIComponent(x); if(n===x) break; x=n; }catch(e){ break; } }
  return x;
}
function resolveActivity(k){
  const parsed=parseActivityKey(k);
  const direct=parsed?.id?activityById(parsed.id):activityById(k);
  const base=parsed?.id||String(k||'');
  const uni=parsed?.uni||'';
  const major=parsed?.major||'';
  const all=[...(DATA.activities||[]),...Object.values(UNIVERSITY_ACTIVITY_OVERRIDES||{}).flat()];
  const candidates=direct?[direct]:all.filter(x=>activityBaseId(x)===base||String(x.name||'')===base);
  if(!candidates.length)return null;
  const a=candidates.find(x=>!uni || (x.universities||[]).includes(uni) || x.routeUniversity===uni) || candidates[0];
  const ctxUni=decodeActivityArg(uni)||a.routeUniversity||((a.universities||[])[0]||'');
  const ctxMajor=decodeActivityArg(major)||a.routeMajor||'';
  const key=activityKey(a,ctxUni,ctxMajor);
  return {a,uni:ctxUni,major:ctxMajor,key}
}

function discoverySet(key,value,max=4){
  S.discovery=S.discovery||{step:0,complete:false,future:[],problem:[],academic:[],experience:[]};
  const a=Array.isArray(S.discovery[key])?S.discovery[key]:[];
  const i=a.indexOf(value);
  if(i>=0){
    a.splice(i,1);
  }else if(value==='unknown'){
    S.discovery[key]=['unknown'];
  }else{
    S.discovery[key]=a.filter(x=>x!=='unknown');
    if(S.discovery[key].length<max)S.discovery[key].push(value);
  }
  save();render();
}
function discoveryPick(key,value){ discoverySet(key,value,3); }
function discoveryNext(){
  const d=S.discovery||{};
  const has=(key)=>Array.isArray(d[key])?d[key].length>0:!!d[key];
  const valid=d.step<4?has(['future','problem','academic','experience'][d.step]):((S.profile?.countries||[]).length>0);
  if(!valid)return;
  if(d.step<4){d.step++;save();render()}
  else{d.complete=true;d.step=5;save();render();requestRouteIntelligenceForDiscovery();}
}
function discoveryBack(){if((S.discovery?.step||0)>0){S.discovery.step--;save();render()}}
function discoveryRestart(){S.discovery={step:0,complete:false,future:[],problem:[],academic:[],experience:[]};save();render()}
function browseGlobal(){S.page='explore';S.q='__directory__';S.discovery=S.discovery||{};S.discovery.complete=true;save();render()}
function discoveryRegionToggle(v){
  const id=decodeURIComponent(v);
  S.profile=S.profile||{nickname:'',strengths:[],countries:[]};
  const a=Array.isArray(S.profile.countries)?S.profile.countries:[];
  const i=a.indexOf(id);
  if(i>=0)a.splice(i,1);
  else if(id==='Undecided')S.profile.countries=['Undecided'];
  else{
    S.profile.countries=a.filter(x=>x!=='Undecided');
    if(S.profile.countries.length<6)S.profile.countries.push(id);
  }
  save();render();
}

function discoveryProfileSignal(d){
  const out=[];
  const values=(v)=>Array.isArray(v)?v:(v?[v]:[]);
  const futureLabels={tech:'futureTech',data:'futureData',people:'futurePeople',business:'futureBusiness',health:'futureHealth',science:'futureScience',create:'futureCreate',society:'futureSociety',write:'futureWrite'};
  const problemLabels={numbers:'problemNumbers',build:'problemBuild',experiment:'problemExperiment',people:'problemPeople',business:'problemBusiness',create:'problemCreate',debate:'problemDebate',society:'problemSociety',communicate:'problemCommunicate'};
  values(d?.future).filter(x=>x!=='unknown').forEach(x=>{if(futureLabels[x])out.push(tr(futureLabels[x]))});
  values(d?.problem).filter(x=>x!=='unknown').forEach(x=>{if(problemLabels[x])out.push(tr(problemLabels[x]))});
  const acad=(d?.academic||[]).filter(x=>x!=='unknown');
  const acadNames={math:'数学',computing:'编程 / AI',science:'科学 / STEM',business:'商业 / 经济',humanities:'人文 / 社会科学',design:'设计 / 创意',writing:'写作 / 语言',research:'研究 / 学术探索',mixed:'跨学科'};
  if(acad.length)out.push(tr('basedOnYou')+': '+acad.slice(0,2).map(x=>acadNames[x]||x).join(' · '));
  return [...new Set(out)].slice(0,5);
}
function discoveryProgramSignals(u,m){
  const d=S.discovery||{}, text=String(m), reasons=[], tokens=[];
  const values=(v)=>Array.isArray(v)?v:(v?[v]:[]);
  const futureLabels={tech:'futureTech',data:'futureData',people:'futurePeople',business:'futureBusiness',health:'futureHealth',science:'futureScience',create:'futureCreate',society:'futureSociety',write:'futureWrite'};
  values(d.future).filter(x=>x!=='unknown').forEach(x=>{
    if(DISCOVERY_TOKENS[x]?.test(text)){reasons.push(tr(futureLabels[x]||'basedOnYou'));tokens.push('future:'+x)}
  });
  const problemRegex={numbers:DISCOVERY_TOKENS.numbers,build:DISCOVERY_TOKENS.build,experiment:/science|engineering|biology|chemistry|physics|research|computational/i,people:DISCOVERY_TOKENS.peopleProblem,business:DISCOVERY_TOKENS.business,create:DISCOVERY_TOKENS.create,debate:DISCOVERY_TOKENS.debate,society:/social|policy|political|education|environment|history|law|global/i,communicate:/communication|journal|media|english|writing|language|marketing/i};
  const problemLabels={numbers:'problemNumbers',build:'problemBuild',experiment:'problemExperiment',people:'problemPeople',business:'problemBusiness',create:'problemCreate',debate:'problemDebate',society:'problemSociety',communicate:'problemCommunicate'};
  values(d.problem).filter(x=>x!=='unknown').forEach(x=>{
    if(problemRegex[x]?.test(text)){reasons.push(tr(problemLabels[x]||'basedOnYou'));tokens.push('problem:'+x)}
  });
  const acad=(d.academic||[]).filter(x=>x!=='unknown');
  const amap={
    math:/math|statistics|data|computer|engineering|physics|econom/i,
    computing:/computer|computing|artificial|data|software|information|technology/i,
    science:/science|physics|biology|chemistry|medicine|engineering|biomedical|life|health/i,
    business:/business|econom|finance|management|account|commerce|marketing/i,
    humanities:/law|political|psychology|history|philosophy|social|communication|english|education/i,
    design:/design|architecture|media|art|creative/i,
    writing:/writing|english|journal|communication|media|language|literature/i,
    research:/science|research|mathematics|data|computing|econom|psychology|engineering/i,
    mixed:/.+/i
  };
  const matchingAcad=acad.filter(x=>amap[x]?.test(text));
  if(matchingAcad.length){
    const acadNames={math:'数学',computing:'编程 / AI',science:'科学 / STEM',business:'商业 / 经济',humanities:'人文 / 社会科学',design:'设计 / 创意',writing:'写作 / 语言',research:'研究 / 学术探索',mixed:'跨学科'};
    reasons.push(tr('basedOnYou')+': '+matchingAcad.slice(0,2).map(x=>acadNames[x]||x).join(' · '));tokens.push('academic');
  }
  const acts=activityMatches(u,m); if(acts.length){reasons.push(tr('schoolEvidence')+': '+acts.length+' '+tr('activities'));tokens.push('school')}
  const meta=getMeta(u,m); if(meta.req||meta.tests?.[u]){reasons.push(tr('schoolEvidence')+': '+tr('requirements'));tokens.push('admissions')}
  return {reasons:[...new Set(reasons)].slice(0,3),tokens,activities:acts,meta};
}
function discoveryDirections(){
  const d=S.discovery||{}, countries=S.profile?.countries||[]; let rows=[];
  for(const u of (DATA.universities||[])){
    if(countries.length&&!countries.includes('Undecided')&&!countries.some(c=>countryMatches(c,u.country)))continue;
    for(const raw of (u.programs||[])){
      const m=typeof raw==='string'?raw:(raw?.name||raw?.title||''); if(!m)continue;
      const sig=discoveryProgramSignals(u.name,m); let weight=sig.tokens.length;
      if(countries.includes(u.country))weight+=1;
      if(!(Array.isArray(d.future)?d.future.length:!!d.future)&&!(Array.isArray(d.problem)?d.problem.length:!!d.problem)&&!(d.academic||[]).length)weight=0;
      if(weight>0)rows.push({u:u.name,country:u.country,m,weight,reasons:sig.reasons,activities:sig.activities,meta:sig.meta});
    }
  }
  rows.sort((a,b)=>b.weight-a.weight||a.u.localeCompare(b.u)||a.m.localeCompare(b.m));
  const picked=[],seen=new Set(),per=new Map();
  for(const r of rows){if(picked.length>=8)break;const n=per.get(r.u)||0;if(n>=2)continue;const k=r.u+'|'+r.m;if(seen.has(k))continue;seen.add(k);picked.push(r);per.set(r.u,n+1)}
  return picked;
}
function discoveryWhy(r){
  const out=r.reasons.slice(0,2); if(!out.length)out.push(tr('broadExploreReason')); return out;
}

    '编程 / AI':['Computer Science','Artificial Intelligence','Data Science','Information Security','Computer Engineering','Software Engineering'],

    '设计 / 创意':['Design','Architecture','Media and Communication','Art, Design and Media'],
    '生物 / 医学':['Biology','Medicine','Public Health','Biomedical Sciences','Life Sciences','Pharmacy','Pharmaceutical Science'],
    '人文 / 社会科学':['Law','Political Science','Psychology','Media and Communication','History','Philosophy','Global Studies'],

}
function recommendedDirections(){
  const profile=S.profile||{};
  const strengths=profile.strengths||[];
  const countries=profile.countries||[];
  const map=profileFieldMap();
  const wanted=[...new Set(strengths.flatMap(x=>map[x]||[]))];
  const results=[];
  for(const u of allUniversities()){
    if(countries.length&&!countries.includes('Undecided')&&!countries.some(c=>countryMatches(c,u.country)))continue;
    const programs=(u.programs||[]).map(x=>typeof x==='string'?x:(x?.name||x?.title||'')).filter(Boolean);
    for(const m of programs){
      const ml=m.toLowerCase();
      let score=0;
      const matched=wanted.filter(w=>ml.includes(w.toLowerCase())||w.toLowerCase().includes(ml));
      score+=matched.length*5;
      if(strengths.some(x=>x==='编程 / AI' && /computer|computing|artificial|data|information|software/i.test(m)))score+=3;
      if(strengths.some(x=>x==='数学' && /math|data|statistics|physics|engineering/i.test(m)))score+=2;
      if(strengths.some(x=>x==='科学 / STEM' && /science|engineering|biology|chemistry|physics|medicine/i.test(m)))score+=2;
      if(strengths.some(x=>x==='商业 / 经济' && /business|econom|finance|management|account/i.test(m)))score+=2;
      if(strengths.some(x=>x==='设计 / 创意' && /design|architecture|media|art/i.test(m)))score+=2;
      if(strengths.some(x=>x==='生物 / 医学' && /biology|medicine|biomedical|life|pharmacy|chemistry/i.test(m)))score+=2;
      if(strengths.some(x=>x==='人文 / 社会科学' && /law|political|psychology|media|history|philosophy|social/i.test(m)))score+=2;
      if(strengths.some(x=>x==='写作 / 传媒' && /media|english|history|journal|philosophy/i.test(m)))score+=2;
      const acts=activityMatches(u.name,m);
      if(acts.length)score+=2;
      if(countries.includes(u.country))score+=3;
      if(!wanted.length)score=1+(acts.length?1:0)+(countries.includes(u.country)?2:0);
      if(score>0)results.push({u:u.name,country:u.country,m,score,matched,activityCount:acts.length});
    }
  }
  results.sort((a,b)=>b.score-a.score||a.u.localeCompare(b.u)||a.m.localeCompare(b.m));
  const picked=[],perUni=new Map();
  for(const r of results){
    const n=perUni.get(r.u)||0;
    if(n>=4)continue;
    picked.push(r);perUni.set(r.u,n+1);
    if(picked.length>=12)break;
  }
  return picked;
}
function recommendationReason(r){
  const profile=S.profile||{};
  const strengths=profile.strengths||[];
  if(r.matched?.length)return r.matched.slice(0,2).join(' · ') + (r.activityCount?' · '+tr('hasMatchedActivities'):'');
  if(strengths.length)return strengths.slice(0,2).join(' · ');
  return tr('broadExploreReason');
}

function activityScopeType(a){
  if(a?.officialProgrammeActivity===true||a?.scopeType==='programmeSpecific')return 'programme';
  if(a?.scopeType==='universityWide')return 'university';
  if(a?.scopeType==='directionEvidence')return 'direction';
  const text=[a?.name,a?.type,a?.sourceLabel,a?.url].filter(Boolean).join(' ').toLowerCase();
  // Independent competitions are relevant evidence, not a university's own programme.
  if(/olympiad|tournament|competition|contest|usaco|wharton|mathematical association|singapore mathematical society|noisg|amc 10|amc 12/.test(text))return 'direction';
  // Campus camps, outreach, pre-collegiate and school-facing research initiatives are university-wide.

function activityMatches(uni,major){
  const key=uni+'|'+major;
  const names=V27_ROUTE_RULES[key]||PROGRAM_ACTIVITY_RULES[key]||[];
  const dedupe=(arr)=>arr
    .filter((a,i,all)=>all.findIndex(x=>x.id===a.id||x.name===a.name)===i);
  const overridePool=(UNIVERSITY_ACTIVITY_OVERRIDES[uni]||[]);
  const pool=dedupe(
    [...ACTIVITY_ALL, ...overridePool]
      .filter(a=>a?.verifiedSource===true)
      .filter(a=>!(a.universities?.length) || a.universities.includes(uni))
      .map(a=>({...a,score:activityScore(a)}))
  );

  /* V46 rule:
     If a route has explicitly curated activities, those activities are
     authoritative. Do not mix in loosely related university activities
     and then rotate them into the route. This was the source of cases
     such as CS receiving a Physics Olympiad.
  */
  const explicit=pool.filter(a=>{
    const named=names.includes(a.name)||names.includes(a.id);
    if(!named) return false;
    /* University-wide opportunities are not allowed to masquerade as
       major-specific activities unless the activity itself carries an
       explicit programmeRoutes relationship for this exact route. */
    if(a.universityRelated && !routeMatchesActivity(a,uni,major)) return false;
    if(activityScopeType(a)==='university' && a.officialProgrammeActivity!==true) return false;
    return true;
  });
  if(explicit.length){
    const ranked=dedupe(explicit).sort((a,b)=>{
      const ai=names.indexOf(a.name)>=0?names.indexOf(a.name):names.indexOf(a.id);
      const bi=names.indexOf(b.name)>=0?names.indexOf(b.name):names.indexOf(b.id);
      return ai-bi || String(a.name).localeCompare(String(b.name));
    });
    return ranked.slice(0,3).map(a=>({
      ...a,
      programKey:programmeKey(uni,major),
      programScoped:true,
      routeUniversity:uni,
      routeMajor:major
    }));
  }

  const discipline=disciplineKeysForMajor(major);
  const majorText=String(major||'').toLowerCase();
  const tokens=majorText.split(/[^a-z0-9]+/).filter(x=>x.length>2);
  const routeScore=a=>{
    const tags=(a.tags||[]).map(x=>String(x).toLowerCase());
    const direct=routeMatchesActivity(a,uni,major)?100:0;
    const tagFit=discipline.reduce((n,k)=>n+((PATH_DISCIPLINE_ACTIVITY_MAP[k]||[])
      .some(t=>tags.includes(String(t).toLowerCase()))?12:0),0);
    const tokenFit=tokens.reduce((n,t)=>n+(tags.some(x=>x.includes(t)||t.includes(x))?7:0),0);
    const uniFit=(a.universities||[]).includes(uni)?4:0;
    const current=a.current?2:0;
    return direct+tagFit+tokenFit+uniFit+current;
  };

  /* No generic discipline/tag fallback here. A professional activity must
     either be explicitly curated for this University × Major route or carry
     an explicit programmeRoutes relationship. General university activities
     are handled separately and are never presented as major-specific. */
  const ranked=dedupe(pool
    .filter(a=>routeMatchesActivity(a,uni,major))
    .filter(a=>activityScopeType(a)!=='university' || a.officialProgrammeActivity===true)
    .map(a=>({...a,_routeScore:routeScore(a)})))
    .sort((a,b)=>b._routeScore-a._routeScore || String(a.name).localeCompare(String(b.name)));

  const max=3;
  return ranked.slice(0,max).map(({_routeScore,...a})=>({
    ...a,
    programKey:programmeKey(uni,major),
    programScoped:true,
    routeUniversity:uni,
    routeMajor:major
  }));
}

function v42Norm(s) {
  return String(s || "").toLowerCase()
    .replace(/&/g," and ")
    .replace(/[^a-z0-9\u4e00-\u9fff]+/g," ")

}

function v42MajorFamily(major) {
  const m = v42Norm(major);
  for (const k of Object.keys(V42_DISCIPLINE_RULES)) {
    if (m === v42Norm(k) || m.includes(v42Norm(k))) return k;
  }
  if (/computer|computing|informatics/.test(m)) return "Computer Science";
  if (/psycholog/.test(m)) return "Psychology";
  if (/econom/.test(m)) return "Economics";
  if (/finance/.test(m)) return "Finance";
  if (/business|management/.test(m)) return "Business";
  if (/math|mathemat/.test(m)) return "Mathematics";
  if (/physics/.test(m)) return "Physics";
  if (/chem/.test(m)) return "Chemistry";
  if (/biology|biological|life science/.test(m)) return "Biology";
  if (/architecture/.test(m)) return "Architecture";
  if (/design/.test(m)) return "Design";
  if (/law|legal/.test(m)) return "Law";
  if (/politic|international relation/.test(m)) return "Political Science";
  if (/history/.test(m)) return "History";
  if (/philosophy/.test(m)) return "Philosophy";
  if (/linguistic|language/.test(m)) return "Linguistics";
  if (/engineering/.test(m)) return "Engineering";
  return null;
}

function v42ActivityText(a) {
  return v42Norm([
    a && a.name, a && a.title, a && a.type, a && a.why,
    a && a.eligibility, a && a.sourceLabel, a && a.description

}

function v42RouteKey(u, major) {
  return v42Norm((u && (u.id || u.name)) || "") + "::" + v42Norm(major || "");
}

function v42RouteActivityScore(activity, major) {
  const family = v42MajorFamily(major);
  if (!family) return 0;
  const rules = V42_DISCIPLINE_RULES[family] || [];
  const hay = v42ActivityText(activity);
  let score = 0;
  for (const term of rules) {
    if (hay.includes(v42Norm(term))) score += 1;
  }
  return score;
}

/* Keep explicit route rules authoritative. For fallback/global opportunities,
   require at least one discipline signal before presenting them as route-specific.
*/
function v42SeparateActivities(list, major) {
  const arr = Array.isArray(list) ? list.filter(Boolean) : [];
  if (!major) return arr;
  const scored = arr.map((a, i) => ({a, i, score: v42RouteActivityScore(a, major)}));
  const relevant = scored.filter(x => x.score > 0);
  if (!relevant.length) return [];
  return relevant
    .sort((x,y) => (y.score - x.score) || (x.i - y.i))
    .map(x => x.a);
}

function runPathDataValidation(){
  const errors=[];
  // Inline handlers can target functions declared globally or explicitly exposed on window.
  // Do not parse source text as a proxy for the live handler registry.
  const onclickRe=/onclick="([^"]+)"/g; let om;
  while((om=onclickRe.exec(document.documentElement.innerHTML))){
    const m=om[1].match(/^([A-Za-z_$][\w$]*)\s*\(/);
    if(m && typeof window[m[1]]!=='function' && !['confirm','alert'].includes(m[1])) errors.push('Missing handler: '+m[1]);
  }
  for(const a of ACTIVITY_ALL){ if(!a.id) errors.push('Activity missing id: '+(a.name||'?')); if(!a.url) errors.push('Activity missing source: '+(a.name||a.id)); }
  const seenIds=new Set();
  for(const a of ACTIVITY_ALL){if(seenIds.has(a.id))errors.push('Duplicate activity id: '+a.id);seenIds.add(a.id)}
  for(const [act,routes] of Object.entries(REAL_PROGRAMME_ROUTES)){ if(!ACTIVITY_ALL.some(a=>a.name===act)) errors.push('Route activity missing: '+act); }
  for(const [route,names] of Object.entries(PROGRAM_ACTIVITY_RULES)){
    const splitAt=route.indexOf('|'), uni=splitAt>=0?route.slice(0,splitAt):'', major=splitAt>=0?route.slice(splitAt+1):'';
    const routeRows=evidenceForProgramme(uni,major)||[];
    for(const n of names){
      const found=routeRows.some(a=>a.name===n||a.id===n)||ACTIVITY_ALL.some(a=>a.name===n||a.id===n)||!!activityById(n);
      if(!found)errors.push('Programme rule missing activity: '+route+' → '+n);
    }
  }
  return errors;
}

/* V42 runtime audit helpers */
function V42_AUDIT_ACTIVITY_SEPARATION(){
  const routes = (typeof PROGRAMS !== "object" && Array.isArray(PROGRAMS)) ? PROGRAMS : [];
  const seen = new Map();
  const crossRoute = new Map();
  const issues = [];
  for (const r of routes){
    const major = r.major || r.program || r.name || "";
    const key = v42RouteKey(r.u || r.university || "", major);
    const acts = activityEvidence(r) || [];
    for (const a of acts){
      const id = String(a.id || a.activityId || a.name || "");
      if (!id) issues.push("activity without stable id: " + key);
      if (!seen.has(id)) seen.set(id, new Set());
      seen.get(id).add(key);
      const txt = v42ActivityText(a);
      if (!txt) issues.push("activity without content: " + id);
    }
  }
  for (const [id, routesForActivity] of seen.entries()){
    if (routesForActivity.size > 8){
      crossRoute.set(id, routesForActivity.size);
    }
  }
  return {routeCount: routes.length, issues, heavilySharedActivities: [...crossRoute.entries()]};
}

function V45_FULL_AUDIT(){
  const errors=[];
  const routes=[];
  for(const u of (DATA.universities||[])){
    for(const raw of (u.programs||[])){
      const m=typeof raw==='string'?raw:(raw?.name||raw?.title||'');
      if(!m) continue;
      const acts=activityEvidence(u.name,m)||[];
      routes.push({u:u.name,m,acts});
      const ids=new Set();
      for(const a of acts){
        if(!a || !a.id) errors.push(`Missing activity id: ${u.name}|${m}`);
        if(ids.has(a.id)) errors.push(`Duplicate activity within route: ${u.name}|${m}|${a.id}`);
        ids.add(a.id);
      }
    }
  }
  const routeActivitySets=new Map();
  for(const r of routes){
    const key=(r.acts||[]).map(a=>String(a.id)).sort().join(',');
    if(key) {
      if(!routeActivitySets.has(key)) routeActivitySets.set(key,[]);
      routeActivitySets.get(key).push(r.u+'|'+r.m);
    }
  }
  /* Identical sets are allowed only when the activities themselves are
     genuinely cross-disciplinary. Flag them for manual review instead of
     silently declaring them unique. */
  const identicalSets=[...routeActivitySets.values()].filter(x=>x.length>1);
  return {
    routeCount:routes.length,
    routesWithActivities:routes.filter(x=>x.acts.length).length,
    emptyRoutes:routes.filter(x=>!x.acts.length).map(x=>x.u+'|'+x.m),
    duplicateActivityIds:[...new Set(errors)],
    identicalActivitySets:identicalSets,
    errors
  };
}

function v52Layers(){
  const L=[{k:'home',label:tr('home'),tone:'root'}];
  if(S.page==='home') return L;
  if(S.page==='explore'){L.push({k:'explore',label:tr('explore'),tone:'explore'});return L}
  if(S.page==='foryou'){L.push({k:'foryou',label:tr('forYou'),tone:'recommend'});return L}
  if(S.page==='plan'){L.push({k:'plan',label:tr('plan'),tone:'plan'});return L}
  if(S.page==='journey'){L.push({k:'plan',label:tr('plan'),tone:'plan'});L.push({k:'journey',label:tr('journey'),tone:'journey'});return L}
  if(S.page==='insights'){L.push({k:'insights',label:tr('insights'),tone:'insight'});return L}
  if(S.page==='university' || S.page==='program' || S.page==='activity'){
    L.push({k:'explore',label:tr('explore'),tone:'explore'});
    if(S.uni)L.push({k:'university',label:S.uni.name,tone:'university'});
    if(S.page==='program' || S.page==='activity') if(S.major)L.push({k:'major',label:S.major,tone:'major'});
    if(S.page==='activity') L.push({k:'activity',label:tr('activity'),tone:'activity'});
  }
  return L;
}

function v52LayerClick(k){
  if(k==='home'){nav('home');return}
  if(k==='explore'){nav('explore');return}
  if(k==='foryou'){nav('foryou');return}
  if(k==='plan'){nav('plan');return}
  if(k==='compare'){nav('plan');return}
  if(k==='journey'){nav('journey');return}
  if(k==='insights'){nav('insights');return}
  if(k==='university' && S.uni){S.page='university';S.major=null;render();return}
  if(k==='major' && S.uni && S.major){S.page='program';render();return}
}

/* ---------- Navigation: reduce cognitive load ---------- */
const V54_NAV_OLD = navBar;
navBar = function(){
  const items = [
    ['home','home','root'],
    ['explore','explore','explore'],
    ['plan','plan','plan']
  ];
  const base = `<div class="top">
    <div class="brand">Path <span>${S.profile?.nickname?esc(S.profile.nickname)+' · ':''}${S.lang==='en'?'EXPLORE · PLAN':S.lang==='tw'?'探索 · 規劃':'探索 · 规划'}</span></div>

  </div>`;
  const nav = `<div class="nav clean-nav v54-main-nav">
    ${items.map(([p,k,t])=>`<button type="button" class="v54-nav-item ${S.page===p?'active ':''}v54-${t}" onclick="nav('${p}')">
      <span class="v54-nav-dot"></span>${tr(k)}
    </button>`).join('')}  </div>`;
  return base + nav + v54Breadcrumb();
};

function v54Breadcrumb(){
  const items = [{k:'home',label:tr('home'),tone:'root'}];
  const p=S.page;
  if(p==='explore') items.push({k:'explore',label:tr('explore'),tone:'explore'});
  else if(p==='foryou') items.push({k:'foryou',label:tr('forYou'),tone:'recommend'});
  else if(p==='plan') items.push({k:'plan',label:tr('plan'),tone:'plan'});
  else if(p==='journey') items.push({k:'plan',label:tr('plan'),tone:'plan'},{k:'journey',label:tr('journey'),tone:'journey'});
  else if(p==='insights') items.push({k:'insights',label:tr('insights'),tone:'insight'});
  else if(p==='university' || p==='program' || p==='activity'){
    items.push({k:'explore',label:tr('explore'),tone:'explore'});
    if(S.uni?.name) items.push({k:'university',label:S.uni.name,tone:'university'});
    if((p==='program'||p==='activity') && S.major) items.push({k:'major',label:S.major,tone:'major'});
    if(p==='activity') items.push({k:'activity',label:tr('activity'),tone:'activity'});
  }
  return `<div class="v54-breadcrumb" aria-label="Path hierarchy">
    ${items.map((x,i)=>`${i?'<span class="v54-crumb-arrow">›</span>':''}
      <button type="button" class="v54-crumb v54-${x.tone} ${i===items.length-1?'current':''}"
        onclick="v54BreadcrumbClick('${x.k}')">
        <span class="v54-crumb-dot"></span><span>${esc(x.label||'')}</span>
      </button>`).join('')}
  </div>`;

/* ---------- Immediate interaction feedback ---------- */
function v54BindInteractionFeedback(){
  if(window.__PATH_V54_INTERACTIONS__) return;
  window.__PATH_V54_INTERACTIONS__=true;

  document.addEventListener('pointerdown', e=>{
    const el=e.target.closest('button,a');
    if(!el) return;
    if(el.matches('button,a')) el.classList.add('v54-pressed');
  }, {passive:true});

  document.addEventListener('pointerup', e=>{
    const el=e.target.closest('button,a');
    if(el) el.classList.remove('v54-pressed');
  }, {passive:true});

  document.addEventListener('pointercancel', e=>{
    const el=e.target.closest('button,a');
    if(el) el.classList.remove('v54-pressed');
  }, {passive:true});

  document.addEventListener('click', e=>{
    const el=e.target.closest('button,a');
    if(!el) return;
    if(el.tagName==='A' && el.target==='_blank'){
      showToast(S.lang==='en'?'Opening official source…':S.lang==='tw'?'正在開啟官方來源…':'正在打开官方来源…');

  }, {passive:true});
}

/* ---------- Restart should actually reset every Path state key ---------- */
restartOnboarding=function(){
  const ok=window.confirm ? window.confirm(tr('restartConfirm')) : true;
  if(!ok)return;
  // Use the actual Storage API here. PATH_STORAGE intentionally wraps only
  // getItem/setItem/removeItem and has no length/key methods.
  try{
    const storage=window.localStorage;
    const keys=[];
    for(let i=0;i<storage.length;i++){
      const k=storage.key(i);
      if(k && k.indexOf('path_')===0) keys.push(k);
    }
    keys.forEach(k=>storage.removeItem(k));
  }catch(e){
    console.warn('Path local reset could not access browser storage',e);
  }
  S={lang:'',page:'home',q:'',country:'ALL',exploreMode:'personalized',uni:null,major:null,
     programFilter:'',saved:[],activityPlan:[],activityType:'全部',liveUnis:[],loading:false,
     profile:null,discovery:{step:0,complete:false,interests:[],subjects:[],v65:true},
     activity:'',activityReturn:'program',activityContext:null,history:[],doneSteps:{},

};

      return `<div class="discovery-shell v65-discovery"><div class="hero"><div class="kicker">${tr('explore')}</div><h1>${escSafe(titles[step])}</h1><p>${escSafe(subs[step])}</p></div><div class="discovery-progress"><span style="width:${Math.max(10,Math.round(((step+1)/3)*100))}%"></span></div><div class="small muted">${step+1} / 3</div><div class="section discovery-question"><div class="discovery-options v65-choice-grid">${body}</div><div class="small muted discovery-count" aria-live="polite">${escSafe(countText)}</div><div class="discovery-actions">${step>0?`<button type="button" class="btn" onclick="discoveryBack()">← ${escSafe(L('上一步','Back','上一步'))}</button>`:'<span></span>'}<button type="button" class="btn primary" ${valid?'':'disabled'} onclick="discoveryNext()">${step===2?escSafe(L('查看方向','See directions','查看方向')):escSafe(L('下一步','Next','下一步'))} →</button></div></div></div>`;
    }
    /* Keep the existing real-data directory/results logic, but use a compact results header. */
    const dirs=v65DiscoveryDirections(),q=(S.q||'').toLowerCase();
    if(q==='__directory__'){
      const arr=DATA.universities||[];
      return `<div class="head"><div><h2>${tr('universities')}</h2><p class="small">${tr('globalDirectoryActive')}</p></div><button class="btn" onclick="S.q='';render()">${tr('back')}</button></div><div class="search"><input value="" oninput="S.q=this.value;render()" placeholder="${tr('searchUni')}"></div><div class="section list">${arr.map(u=>`<div class="card"><div class="small muted">${escSafe(u.country)}</div><h3>${escSafe(u.name)}</h3><p class="small muted">${escSafe(u.source||'')}</p><div class="small">${escSafe(u.verified||'')}</div><button class="btn" style="margin-top:10px" onclick="openUniEncoded('${attrArg(u.name)}')">${tr('view')} →</button></div>`).join('')}</div>`;
    }
    if(q){
      const arr=(DATA.universities||[]).filter(u=>(u.name+' '+u.country+' '+(u.programs||[]).join(' ')).toLowerCase().includes(q));
      return `<div class="head"><div><h2>${tr('universities')}</h2><p class="small">${tr('globalDirectoryActive')}</p></div><button class="btn" onclick="S.q='';render()">${tr('back')}</button></div><div class="search"><input value="${escSafe(S.q)}" oninput="S.q=this.value;render()" placeholder="${tr('searchUni')}"></div><div class="section list">${arr.map(u=>`<div class="card"><div class="small muted">${escSafe(u.country)}</div><h3>${escSafe(u.name)}</h3><p class="small muted">${escSafe(u.source||'')}</p><button class="btn" onclick="openUniEncoded('${attrArg(u.name)}')">${tr('view')} →</button></div>`).join('')||`<div class="empty">${tr('no')}</div>`}</div>`;
    }
    const prefs=[...(d.interests||[]).filter(x=>x!=='undecided').map(x=>V65_INTERESTS.find(r=>r[0]===x)).filter(Boolean).map(v65Label),...(d.subjects||[]).filter(x=>x!=='Undecided').map(x=>V65_SUBJECTS.find(r=>r[0]===x)).filter(Boolean).map(v65Label),...(S.profile?.countries||[]).filter(x=>x!=='Undecided').map(v65RegionLabel)];
    return `<div class="hero"><div class="kicker">${tr('explore')}</div><h1>${escSafe(L('你的方向探索结果','Your exploration results','你的方向探索結果'))}</h1><p>${escSafe(L('这些方向基于你的选择和 Path 已收录的大学与专业目录，不代表录取预测；重要信息请回学校官网核对。','These directions use your choices and Path’s stored university and programme catalogue. They are not admission predictions; verify important details on official university sites.','這些方向根據你的選擇和 Path 已收錄的大學與專業目錄整理，不代表錄取預測；重要資訊請回學校官網核對。'))}</p><div class="hero-actions"><button class="btn" onclick="discoveryRestart()">${escSafe(L('重新回答','Refine','重新回答'))}</button><button class="btn" onclick="browseGlobal()">${tr('browseGlobal')}</button></div></div><div class="section discovery-answerbar">${prefs.map(x=>`<span>${escSafe(x)}</span>`).join('')||`<span>${tr('notSure')}</span>`}</div><div class="section head"><div><h2>${tr('recommendedDirections')}</h2><p class="small">${escSafe(L('来自 Path 已收录的大学 × 专业目录；保存后才会成为你的 Path 路线。','Built from Path’s stored University × Major catalogue. A route is created only when you save it.','來自 Path 已收錄的大學 × 專業目錄；儲存後才會成為你的 Path 路線。'))}</p></div><span class="small muted">${dirs.length}</span></div><div class="section direction-results">${dirs.map(r=>`<div class="direction-result"><div class="small muted">${escSafe(r.u)} · ${escSafe(r.country)}</div><h3>${escSafe(r.m)}</h3><div class="tagrow"><span class="type">${tr('verifiedSource')}</span>${r.activityCount?`<span class="type">${r.activityCount} ${tr('activities')}</span>`:''}</div><div class="why"><div class="data-label">${tr('whyDirection')}</div>${r.reasons.map(x=>`<div class="small">${escSafe(x)}</div>`).join('')}</div><div class="section mini-actions"><button class="btn" onclick="openRecommendedEncoded('${attrArg(r.u)}','${attrArg(r.m)}')">${tr('view')} →</button></div></div>`).join('')||`<div class="empty">${tr('discoveryEmpty')}</div>`}</div><div class="section card"><div class="data-label">${tr('schoolEvidence')}</div><p class="small">${tr('realDataText')}</p></div>`;
  };

  function v65InterestMatch(interest,major){
    const m=String(major||'').toLowerCase();
    const rules={
      math:/math|statistics|data|physics|engineering|quantitative|computer|econom/i,
      computing:/computer|computing|informatics|software|artificial|data|information|cyber|technology|engineering/i,
      science:/science|physics|chemistry|biology|biomedical|medicine|life|environment|engineering/i,
      business:/business|econom|finance|management|account|marketing|commerce/i,
      social:/social|political|psychology|sociology|law|history|philosophy|international|policy/i,
      design:/design|architecture|art|media|creative/i,
      writing:/writing|english|language|linguistics|literature|communication|media|journal/i
    };
    return rules[interest]?rules[interest].test(m):false;
  }
  function v65SubjectMatch(subject,major){
    const m=String(major||'').toLowerCase();
    const rules={
      'Mathematics':/math|statistics|data|computer|engineering|physics|econom/i,
      'Further Mathematics':/math|statistics|data|computer|engineering|physics/i,
      'Computer Science':/computer|computing|informatics|software|data|artificial|technology/i,
      'Physics':/physics|engineering|computer|astronomy|materials/i,
      'Chemistry':/chemistry|chemical|pharmacy|pharmaceutical|medicine|biology|materials/i,
      'Biology':/biology|biomedical|medicine|life|neuroscience|psychology|environment/i,
      'Economics':/econom|business|finance|management|policy|data/i,
      'Business':/business|management|finance|marketing|account|commerce|entrepreneur/i,
      'History':/history|political|international|law|philosophy|social/i,
      'Languages':/language|linguistics|english|literature|communication|media/i,
      'Art / Design':/design|architecture|art|media|creative/i
    };
    return rules[subject]?rules[subject].test(m):false;
  }
  v65DiscoveryDirections=function(){
    const d=v65EnsureDiscovery(), interests=(d.interests||[]).filter(x=>x!=='undecided'), subjects=(d.subjects||[]).filter(x=>x!=='Undecided'), countries=S.profile?.countries||[];
    const rows=[];
    for(const u of (DATA.universities||[])){
      if(countries.length&&!countries.includes('Undecided')&&!countries.some(c=>countryMatches(c,u.country)))continue;
      for(const raw of (u.programs||[])){
        const m=typeof raw==='string'?raw:(raw?.name||raw?.title||''); if(!m)continue;
        let score=0;const reasons=[];
        const im=interests.filter(x=>v65InterestMatch(x,m));
        const sm=subjects.filter(x=>v65SubjectMatch(x,m));
        if(im.length){score+=im.length*3;reasons.push(L('兴趣匹配：','Interest match: ','興趣匹配：')+im.map(x=>v65Label(V65_INTERESTS.find(r=>r[0]===x)||[x,x,x,x])).slice(0,2).join(' · '));}
        if(sm.length){score+=sm.length*2;reasons.push(L('学科匹配：','Subject match: ','學科匹配：')+sm.map(x=>v65Label(V65_SUBJECTS.find(r=>r[0]===x)||[x,x,x,x])).slice(0,2).join(' · '));}
        if(countries.includes(u.country)){score+=2;reasons.push(L('地区偏好：','Region preference: ','地區偏好：')+v65RegionLabel(u.country));}
        const acts=activityMatches(u.name,m)||[];
        const meta=getMeta(u.name,m)||{};
        if(acts.length){reasons.push(L('已有来源链接的活动：','Source-linked opportunities: ','已有來源連結的活動：')+acts.length);score+=1;}
        if(meta.req?.[u.name]||meta.tests?.[u.name]){reasons.push(L('已有官方申请信息：','Official admissions data found: ','已有官方申請資訊：'));score+=1;}
        if(score>0)rows.push({u:u.name,country:u.country,m,score,reasons:[...new Set(reasons)].slice(0,3),activityCount:acts.length});
      }
    }
    rows.sort((a,b)=>b.score-a.score||a.u.localeCompare(b.u)||a.m.localeCompare(b.m));
    const out=[],per=new Map();
    for(const r of rows){const n=per.get(r.u)||0;if(n>=3)continue;out.push(r);per.set(r.u,n+1);if(out.length>=12)break;}
    return out;
  };

  /* Safe numeric/real-data Compare model. No admission probability or arbitrary total score. */
  function v65CompareRow(u,m){
    const uni=findUni(u)||{};
    const meta=getMeta(u,m)||{};
    const programmeActs=activityMatches(u,m)||[];
    const uniActs=universityOpportunities(u)||[];
    const evidence=globalActivitiesForProgramme(u,m)||[];
    const sourceFlags=[
      !!uni.url,
      !!meta.req?.[u],
      !!meta.tests?.[u],
      programmeActs.length>0,
      uniActs.length>0,
      evidence.length>0
    ];
    const available=sourceFlags.filter(Boolean).length;
    const coverage=Math.round((available/sourceFlags.length)*100);
    return {
      u,m,uni,meta,programmeActs,uniActs,evidence,available,totalFields:sourceFlags.length,coverage,
      officialSources:routeOfficialSourceCount(u,m),
      admissionsRequirement:meta.req?.[u]||null,
      admissionsTest:meta.tests?.[u]||null,
      routeId:`${u}|${m}`
    };
  }

  v32Compare=function(){
    const dirs=savedDirections();
    if(dirs.length<2)return `<div class="hero"><div class="kicker">${tr('comparePaths')}</div><h1>${tr('comparePaths')}</h1><p>${tr('compareSubtitle')}</p></div><div class="section card"><h3>${tr('addMoreToCompare')}</h3><p class="muted">${tr('compareHint')}</p><button class="btn" onclick="nav('explore')">${tr('explore')} →</button></div>`;
    const rows=dirs.slice(0,4).map(d=>v65CompareRow(d.u,d.m));
    const txt=v=>v==null||v===''?tr('notVerified'):escSafe(v);
    return `<div class="hero"><div class="kicker">${tr('comparePaths')}</div><h1>${tr('comparePaths')}</h1><p>${escSafe(L('只比较你真正保存的方向。下方数字来自 Path 当前存储的数据记录，本版本未重新核验来源时效；不代表录取概率。','Compare only routes you actually saved. Numbers below are counts derived from records currently stored in Path; source freshness has not been rechecked in this build. They are not admission probabilities.','只比較你真正儲存的方向。下方數字來自 Path 目前儲存的資料記錄，本版本未重新核驗來源時效；不代表錄取機率。'))}</p></div>
      <div class="section card"><div class="data-label">${escSafe(L('数据覆盖率','Data coverage','資料覆蓋率'))}</div><p class="small muted">${escSafe(L('公式：可用数据类别 ÷ 6。这表示数据可用性，不代表已核验、排名或录取概率；当前日期和要求仍需以官方来源确认为准。','Formula: available categories ÷ 6. This measures data availability, not verification, ranking, or admission probability. Confirm current dates and requirements with official sources.','公式：可用資料類別 ÷ 6。這表示資料可用性，不代表已核驗、排名或錄取機率；目前日期和要求仍需以官方來源確認。'))}</p><div class="v65-compare-grid">${rows.map(x=>`<div class="v65-compare-summary"><div class="small muted">${escSafe(x.u)}</div><h3>${escSafe(x.m)}</h3><div class="v65-big-number">${x.coverage}%</div><div class="small muted">${x.available} / ${x.totalFields} ${escSafe(L('数据项可用','data categories available','資料項可用'))}</div></div>`).join('')}</div></div>
      <div class="section card"><div class="v31-table-wrap"><table class="v31-table"><thead><tr><th>${escSafe(L('来源与数据','Sources and data','來源與資料'))}</th>${rows.map(x=>`<th>${escSafe(x.u)}<br><span class="v29-muted">${escSafe(x.m)}</span></th>`).join('')}</tr></thead><tbody>
      <tr><td>${escSafe(L('官方来源数量','Official source count','官方來源數量'))}</td>${rows.map(x=>`<td><b>${x.officialSources}</b></td>`).join('')}</tr>
      <tr><td>${escSafe(L('与此方向匹配的来源活动','Source-linked activities matched to this direction','與此方向匹配的來源活動'))}</td>${rows.map(x=>`<td><b>${x.programmeActs.length}</b></td>`).join('')}</tr>
      <tr><td>${escSafe(L('大学级官方机会','University-wide official opportunities','大學級官方機會'))}</td>${rows.map(x=>`<td><b>${x.uniActs.length}</b></td>`).join('')}</tr>
      <tr><td>${escSafe(L('方向证据候选','Direction evidence candidates','方向證據候選'))}</td>${rows.map(x=>`<td><b>${x.evidence.length}</b></td>`).join('')}</tr>
      <tr><td>${escSafe(L('官方申请要求','Official admissions requirement','官方申請要求'))}</td>${rows.map(x=>`<td>${txt(x.admissionsRequirement)}</td>`).join('')}</tr>
      <tr><td>${escSafe(L('Admissions Test','Admissions test','Admissions Test'))}</td>${rows.map(x=>`<td>${txt(x.admissionsTest)}</td>`).join('')}</tr>
      <tr><td>${escSafe(L('数据状态','Data status','資料狀態'))}</td>${rows.map(x=>`<td>${x.coverage===100?escSafe(L('6/6 已有数据','6/6 available','6/6 已有資料')):escSafe(L(`${x.available}/6 已有数据` ,`${x.available}/6 available`,`${x.available}/6 已有資料`))}</td>`).join('')}</tr>
      </tbody></table></div><p class="v31-source-note">${escSafe(L('这些数字是数据计数/覆盖率，不是录取评分。Path 后续可以在后端用同一套真实数据继续计算更细的准备指标。','These are data counts/coverage, not admission scores. Path can later calculate more detailed preparation metrics from the same verified data in the backend.','這些數字是資料計數/覆蓋率，不是錄取評分。Path 後續可以在後端用同一套真實資料繼續計算更細的準備指標。'))}</p></div>`;
  };
  compare=v32Compare;

  /* Remove redundant View Direction action from saved route cards. */
  const oldPlan=plan;
  plan=function(){
    const html=oldPlan();
    return html.replace(/<button class="btn" onclick="S\.uni=findUni\(decodeURIComponent\('[^']+'\)\);S\.major=decodeURIComponent\('[^']+'\);S\.page='program';render\(\)">.*?<\/button>/g,'');
  };

  /* No interaction motion: override late V54 rules. */
  const style=document.createElement('style');
  style.textContent=`
    .v65-choice-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px!important;margin-top:8px!important}
    .v65-choice{min-height:52px!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;text-align:left!important;padding:14px 15px!important;border-radius:16px!important;background:#fff!important}
    .v65-choice.selected{background:#17181b!important;color:#fff!important;border-color:#17181b!important}
    .v65-choice:active,.v65-choice:focus,.v65-choice:hover{transform:none!important;animation:none!important;box-shadow:none!important}
    .v65-discovery .hero{margin-bottom:12px!important}
    .v65-discovery .discovery-question{padding-top:4px!important}
    .v65-compare-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .v65-compare-summary{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}
    .v65-big-number{font-size:30px;font-weight:850;letter-spacing:-1px;margin-top:6px}
    button,.btn,.chip,.major,.choice-chip,.nav button,.home-link-card,.activity-card,a{transition:none!important;animation:none!important;transform:none!important}
    button:active,.btn:active,.chip:active,.major:active,.choice-chip:active,.nav button:active,.activity-card:active,a:active{transform:none!important;filter:none!important;box-shadow:none!important}
    @media(max-width:700px){.v65-choice-grid{grid-template-columns:1fr 1fr!important}.v65-compare-grid{grid-template-columns:1fr 1fr!important}}
    @media(max-width:430px){.v65-choice-grid,.v65-compare-grid{grid-template-columns:1fr!important}}
  `;
  document.head.appendChild(style);

  /* Ensure legacy discovery records don't force the old 5-step screen. */
  if(S.discovery && S.discovery.complete!==true && !Array.isArray(S.discovery.interests)){
    S.discovery={step:0,complete:false,interests:[],subjects:[],v65:true};
  }
  window.PATH_V65_AUDIT={
    version:'V65',
    exploreQuestions:3,
    compareUsesRealCounts:true,
    compareHasUnsupportedOverallScore:false
  };
  try{render();}catch(e){console.error('V65 render',e)}
})();

<!-- =========================================================
 V66 — Real-data comparison layer
 Rules:
 - never synthesize programme names for universities without verified programmes
 - Compare uses only observable/traceable facts
 - numeric values are counts/coverage, not admission scores
 - AI may explain these facts later; it may not invent facts
 ========================================================= -->
<script>
(function(){
  // Strict data-integrity rule: no country-based invented major lists.
  // A university without verified programmes simply shows that the programme index is unavailable.
  window.pathExploreProgramsStrict=function(u){
    const actual=(u?.programs||[]).map(x=>typeof x==='string'?x:(x?.name||x?.title||'')).filter(Boolean);
    return {items:[...new Set(actual)],verified:actual.length>0};
  };
  if(typeof pathExplorePrograms==='function') pathExplorePrograms=window.pathExploreProgramsStrict;

  function realCompareFacts(u,m){
    const uni=findUni(u)||{};
    const meta=getMeta(u,m)||{};
    const majorActs=(activityMatches(u,m)||[]).filter(a=>a&&a.verifiedSource===true);
    const uniActs=(universityOpportunities(u)||[]).filter(a=>a&&a.verifiedSource===true);
    const directionActs=(globalActivitiesForProgramme(u,m)||[]).filter(a=>a&&a.verifiedSource===true);
    const officialSources=[
      uni.url,
      ...(Array.isArray(uni.web_pages)?uni.web_pages:[]),
      meta.sourceUrl,
      meta.requirementsUrl,
      meta.testsUrl,
      meta.admissions?.international?.official
    ].filter(v=>typeof v==='string'&&/^https?:\/\//i.test(v.trim())).map(v=>v.trim());
    const requirementKnown=!!meta.req?.[u];
    const testKnown=!!meta.tests?.[u];
    const sourceCount=new Set(officialSources).size;
    // These are counts of facts that exist, not subjective scores.
    const factSlots=[
      !!uni.url,
      requirementKnown,
      testKnown,
      majorActs.length>0,
      uniActs.length>0,
      directionActs.length>0
    ];
    const coverage=Math.round((factSlots.filter(Boolean).length/factSlots.length)*100);
    const complexitySignals=[requirementKnown,testKnown,!!meta.admissions?.international?.official].filter(Boolean).length;
    return {
      university:u,major:m,
      programmeVerified:Array.isArray(uni.programs)&&uni.programs.includes(m),
      programmeSource:uni.url||'',
      sourceCount,
      coverage,
      requirementKnown,
      requirement:meta.req?.[u]||'',
      admissionsTestKnown:testKnown,
      admissionsTest:meta.tests?.[u]||'',
      majorActivityCount:majorActs.length,
      universityOpportunityCount:uniActs.length,
      directionEvidenceCount:directionActs.length,
      complexitySignalCount:complexitySignals,
      verifiedAt:uni.verified||'not recorded — source link listed; page not rechecked'
    };
  }
  window.PATH_REAL_COMPARE_FACTS=realCompareFacts;

  function factCell(value, label){
    return `<div class="v66-fact"><b>${esc(String(value))}</b><span>${esc(label)}</span></div>`;
  }
  function sourceLink(url,label){
    return url?`<a class="source" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)} ↗</a>`:tr('notVerified');
  }

  // Replace Compare with a compact evidence table. No 1–100 admissions score.
  compare=function(){
    const dirs=savedDirections();
    if(dirs.length<2)return `<div class="hero"><div class="kicker">${tr('comparePaths')}</div><h1>${tr('comparePaths')}</h1><p>${tr('planCompareText')}</p></div>${window.PATH_V73_UNIVERSITY_AUDIT_PANEL()}<div class="section card"><h3>${tr('addMoreToCompare')}</h3><button class="btn" onclick="nav('explore')">${tr('explore')} →</button></div>`;
    const rows=dirs.slice(0,4).map(d=>realCompareFacts(d.u,d.m));
    const labels={
      coverage:S.lang==='en'?'Available data coverage':S.lang==='tw'?'可用資料覆蓋':'可用数据覆盖',
      sources:S.lang==='en'?'Official source links':S.lang==='tw'?'官方來源連結':'官方来源链接',
      programme:S.lang==='en'?'Programme-specific official activities':S.lang==='tw'?'與此方向匹配的來源活動':'与此方向匹配的来源活动',
      university:S.lang==='en'?'University-wide official opportunities':S.lang==='tw'?'大學官方機會':'大学官方机会',
      evidence:S.lang==='en'?'Path direction evidence':S.lang==='tw'?'Path 方向證據':'Path 方向证据',
      req:S.lang==='en'?'Official requirement data':S.lang==='tw'?'官方要求資料':'官方要求数据',
      test:S.lang==='en'?'Admissions test data':S.lang==='tw'?'招生考試資料':'招生考试数据',
      complexity:S.lang==='en'?'Documented application signals':S.lang==='tw'?'已記錄申請訊號':'已记录申请信号'
    };

官网再次确认。')}</p></div>`;
